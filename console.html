<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Консоль · Электронная школа</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f8faff;
      min-height: 100vh;
      padding-top: 80px;
    }

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: #ffffff;
      border-bottom: 1px solid #eef3fa;
      box-shadow: 0 4px 20px rgba(0, 20, 40, 0.06);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .navbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      background: #2a7de1;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(42, 125, 225, 0.20);
    }

    .logo-text {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: #0a1e3c;
    }
    .logo-text span {
      color: #2a7de1;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-link {
      padding: 8px 18px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 14px;
      color: #1f2b48;
      text-decoration: none;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: 1.5px solid transparent;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }
    .nav-link:hover {
      background: #f0f4fe;
      border-color: #d0dae9;
    }
    .nav-link .material-symbols-outlined {
      font-size: 18px;
    }

    .navbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f0f6ff;
      padding: 6px 16px 6px 12px;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 500;
      color: #0a1e3c;
      cursor: pointer;
      transition: 0.15s;
      text-decoration: none;
      border: none;
      font-family: 'Inter', sans-serif;
    }
    .user-badge:hover {
      background: #e5effb;
      transform: scale(0.97);
    }
    .user-badge .material-symbols-outlined {
      color: #2a7de1;
      font-size: 20px;
    }

    .btn {
      border: none;
      padding: 6px 18px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Inter', sans-serif;
      text-decoration: none;
    }

    .btn-primary {
      background: #2a7de1;
      color: white;
      box-shadow: 0 4px 12px rgba(42, 125, 225, 0.20);
    }
    .btn-primary:hover {
      background: #1a5fb0;
      transform: scale(0.97);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 48px;
      box-shadow: 0 24px 60px rgba(0, 20, 40, 0.08);
      padding: 32px 40px 44px;
      border: 1px solid #f0f5fe;
    }

    .page-title {
      font-size: 26px;
      font-weight: 600;
      color: #0a1e3c;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .page-title .material-symbols-outlined {
      color: #8b5cf6;
      font-size: 32px;
    }

    .page-sub {
      color: #5f7696;
      font-size: 16px;
      margin-bottom: 28px;
    }

    /* ----- КОНСОЛЬ ----- */
    .console-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    .console-card {
      background: #f9fcff;
      border-radius: 24px;
      padding: 20px 24px;
      border: 1px solid #eef3fa;
    }

    .console-card .card-label {
      font-size: 15px;
      font-weight: 600;
      color: #0a1e3c;
      margin-bottom: 12px;
    }

    .console-card input,
    .console-card textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #dce4ef;
      border-radius: 16px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      transition: 0.15s;
      background: #ffffff;
      margin-bottom: 10px;
    }

    .console-card input:focus,
    .console-card textarea:focus {
      outline: none;
      border-color: #2a7de1;
      box-shadow: 0 0 0 4px rgba(42, 125, 225, 0.10);
    }

    .console-card textarea {
      resize: vertical;
      min-height: 60px;
    }

    .console-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-console {
      border: none;
      padding: 8px 20px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Inter', sans-serif;
    }

    .btn-console-primary {
      background: #2a7de1;
      color: white;
    }
    .btn-console-primary:hover {
      background: #1a5fb0;
      transform: scale(0.97);
    }

    .btn-console-success {
      background: #1a8a4a;
      color: white;
    }
    .btn-console-success:hover {
      background: #146e3a;
      transform: scale(0.97);
    }

    .btn-console-danger {
      background: #c74a4a;
      color: white;
    }
    .btn-console-danger:hover {
      background: #a33a3a;
      transform: scale(0.97);
    }

    .btn-console-outline {
      background: transparent;
      color: #1f2b48;
      border: 1.5px solid #d0dae9;
    }
    .btn-console-outline:hover {
      background: #f0f4fe;
    }

    .console-message {
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 40px;
      margin-top: 8px;
      display: none;
    }
    .console-message.show {
      display: block;
    }
    .console-message.success {
      background: #e8f5ed;
      color: #1a8a4a;
    }
    .console-message.error {
      background: #fff0f0;
      color: #c74a4a;
    }

    .edit-section-title {
      font-size: 16px;
      font-weight: 600;
      color: #0a1e3c;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .edit-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .edit-item {
      background: #f9fcff;
      border-radius: 16px;
      padding: 16px 20px;
      border: 1px solid #eef3fa;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .edit-item .edit-info {
      flex: 1;
      min-width: 150px;
    }
    .edit-item .edit-info .edit-title {
      font-weight: 500;
      color: #0a1e3c;
    }
    .edit-item .edit-info .edit-meta {
      font-size: 13px;
      color: #6a7f9e;
    }

    .edit-item .edit-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .edit-item .edit-fields {
      display: none;
      width: 100%;
      padding-top: 12px;
      border-top: 1px solid #eef3fa;
      margin-top: 12px;
    }
    .edit-item .edit-fields.open {
      display: block;
    }

    .edit-item .edit-fields input,
    .edit-item .edit-fields textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1.5px solid #dce4ef;
      border-radius: 12px;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      margin-bottom: 8px;
    }

    .footer {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid #eef3fa;
      font-size: 13px;
      color: #889bb3;
      text-align: center;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #6a7f9e;
    }

    @media (max-width: 700px) {
      .navbar {
        padding: 10px 16px;
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .navbar-left {
        flex-wrap: wrap;
        justify-content: space-between;
      }
      .nav-links {
        justify-content: flex-start;
      }
      .navbar-right {
        justify-content: flex-start;
      }
      body {
        padding-top: 130px;
      }
      .console-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 480px) {
      .container { padding: 20px 16px 28px; border-radius: 32px; }
      .navbar-left { flex-direction: column; align-items: flex-start; gap: 6px; }
    }
  </style>
</head>
<body>

<header class="navbar" id="navbar">
  <div class="navbar-left">
    <div class="logo-area">
      <div class="logo-icon">Ш</div>
      <div class="logo-text">Электро<span>школа</span></div>
    </div>
    <nav class="nav-links">
      <a href="index.html" class="nav-link">
        <span class="material-symbols-outlined">home</span>
        Главная
      </a>
    </nav>
  </div>
  <div class="navbar-right" id="userArea">
    <!-- Имя пользователя -->
  </div>
</header>

<div class="container">
  <div class="page-title">
    <span class="material-symbols-outlined">admin_panel_settings</span>
    Консоль администратора
  </div>
  <div class="page-sub">Управление новостями</div>

  <!-- Форма добавления -->
  <div class="console-grid">
    <div class="console-card">
      <div class="card-label">➕ Добавить новость</div>
      <input type="text" id="addTitle" placeholder="Заголовок" />
      <textarea id="addDesc" placeholder="Описание"></textarea>
      <input type="number" id="addDate" placeholder="Unix timestamp" />
      <button class="btn-console btn-console-success" id="addNewsBtn">➕ Добавить</button>
      <div id="addMessage" class="console-message"></div>
    </div>

    <div class="console-card">
      <div class="card-label">🗑️ Удалить по индексу</div>
      <input type="number" id="deleteIndex" placeholder="Индекс новости" />
      <button class="btn-console btn-console-danger" id="deleteNewsBtn">🗑️ Удалить</button>
      <div id="deleteMessage" class="console-message"></div>
    </div>
  </div>

  <!-- Редактирование существующих -->
  <div class="edit-section-title">
    <span class="material-symbols-outlined" style="color:#2a7de1;">edit</span>
    Редактировать новости
  </div>
  <div id="editList" class="edit-list">
    <div class="loading">⏳ Загрузка...</div>
  </div>

  <div class="footer">© 2026 · Электронная школа</div>
</div>

<!-- FIREBASE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-analytics.js";
  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
  import {
    getDatabase,
    ref,
    get,
    set,
    remove,
    child,
    onValue
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDGPv-cUMTSRBq9ZLmpDZFT-JYc3UOcCpY",
    authDomain: "digitalschool-f2c90.firebaseapp.com",
    projectId: "digitalschool-f2c90",
    storageBucket: "digitalschool-f2c90.firebasestorage.app",
    messagingSenderId: "797143730107",
    appId: "1:797143730107:web:b19437db896170d88b269e",
    measurementId: "G-FT9ENP491P"
  };

  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const auth = getAuth(app);
  const db = getDatabase(app);

  const AUTH_URL = 'https://xsynda.github.io/digitalschool.github.io/auth.html';
  const ACCOUNT_URL = 'account.html';

  const userArea = document.getElementById('userArea');
  const editList = document.getElementById('editList');

  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function formatDate(timestamp) {
    if (!timestamp) return '—';
    const date = new Date(timestamp * 1000);
    return date.toLocaleDateString('ru-RU', {
      day: 'numeric',
      month: 'long',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });
  }

  function showMessage(element, text, type) {
    element.textContent = text;
    element.className = 'console-message show ' + type;
    setTimeout(() => {
      element.className = 'console-message';
    }, 4000);
  }

  // ----- Рендер списка для редактирования -----
  function renderEditList(newsData) {
    if (!newsData || Object.keys(newsData).length === 0) {
      editList.innerHTML = `
        <div class="empty-state" style="padding:24px;">
          <p style="color:#6a7f9e;">Новостей нет</p>
        </div>
      `;
      return;
    }

    const keys = Object.keys(newsData).map(Number).sort((a, b) => b - a);

    let html = '';
    for (const key of keys) {
      const item = newsData[key];
      if (!item) continue;
      html += `
        <div class="edit-item" data-key="${key}">
          <div class="edit-info">
            <div class="edit-title">#${key}: ${escapeHtml(item.title || 'Без названия')}</div>
            <div class="edit-meta">${formatDate(item.date)}</div>
          </div>
          <div class="edit-actions">
            <button class="btn-console btn-console-outline toggle-edit-btn">✏️ Редактировать</button>
            <button class="btn-console btn-console-danger delete-item-btn">🗑️</button>
          </div>
          <div class="edit-fields">
            <input type="text" class="edit-field-title" value="${escapeHtml(item.title || '')}" placeholder="Заголовок" />
            <textarea class="edit-field-desc" placeholder="Описание">${escapeHtml(item.desc || '')}</textarea>
            <input type="number" class="edit-field-date" value="${item.date || ''}" placeholder="Unix timestamp" />
            <div style="display:flex; gap:8px; margin-top:8px;">
              <button class="btn-console btn-console-primary save-edit-btn">💾 Сохранить</button>
              <button class="btn-console btn-console-outline cancel-edit-btn">Отмена</button>
            </div>
            <div class="console-message edit-message"></div>
          </div>
        </div>
      `;
    }
    editList.innerHTML = html;

    // Обработчики
    document.querySelectorAll('.toggle-edit-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const fields = btn.closest('.edit-item').querySelector('.edit-fields');
        fields.classList.toggle('open');
      });
    });

    document.querySelectorAll('.cancel-edit-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const fields = btn.closest('.edit-item').querySelector('.edit-fields');
        fields.classList.remove('open');
      });
    });

    document.querySelectorAll('.save-edit-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const item = btn.closest('.edit-item');
        const key = parseInt(item.dataset.key);
        const title = item.querySelector('.edit-field-title').value.trim();
        const desc = item.querySelector('.edit-field-desc').value.trim();
        const date = parseInt(item.querySelector('.edit-field-date').value);
        const msg = item.querySelector('.edit-message');

        if (!title || !date) {
          showMessage(msg, '⚠️ Заполните заголовок и дату', 'error');
          return;
        }

        try {
          await set(ref(db, 'news/' + key), { title, desc, date });
          showMessage(msg, '✅ Новость обновлена', 'success');
          setTimeout(() => {
            item.querySelector('.edit-fields').classList.remove('open');
          }, 1000);
        } catch (e) {
          showMessage(msg, '❌ Ошибка: ' + e.message, 'error');
        }
      });
    });

    document.querySelectorAll('.delete-item-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const item = btn.closest('.edit-item');
        const key = parseInt(item.dataset.key);
        if (confirm(`Удалить новость #${key}?`)) {
          try {
            await remove(ref(db, 'news/' + key));
            showMessage(document.getElementById('deleteMessage'), '✅ Новость удалена', 'success');
          } catch (e) {
            showMessage(document.getElementById('deleteMessage'), '❌ Ошибка: ' + e.message, 'error');
          }
        }
      });
    });
  }

  // ----- Загрузка новостей для редактирования -----
  function loadEditList() {
    const newsRef = ref(db, 'news');
    onValue(newsRef, (snapshot) => {
      if (snapshot.exists()) {
        renderEditList(snapshot.val());
      } else {
        renderEditList(null);
      }
    }, (error) => {
      console.error('Ошибка загрузки:', error);
      editList.innerHTML = `
        <div class="empty-state" style="padding:24px;">
          <p style="color:#c74a4a;">❌ Ошибка загрузки</p>
        </div>
      `;
    });
  }

  // ----- Рендер шапки -----
  function renderHeader(user) {
    if (user) {
      const displayName = user.displayName || user.email || 'Пользователь';
      userArea.innerHTML = `
        <a href="${ACCOUNT_URL}" class="user-badge">
          <span class="material-symbols-outlined">account_circle</span>
          ${escapeHtml(displayName)}
        </a>
      `;
    } else {
      userArea.innerHTML = `
        <a href="${AUTH_URL}" class="btn btn-primary">
          <span class="material-symbols-outlined" style="font-size:18px;">login</span>
          Войти
        </a>
      `;
    }
  }

  // ----- Инициализация консоли -----
  function initConsole() {
    // Добавление
    document.getElementById('addNewsBtn').addEventListener('click', async () => {
      const title = document.getElementById('addTitle').value.trim();
      const desc = document.getElementById('addDesc').value.trim();
      const date = parseInt(document.getElementById('addDate').value);
      const msg = document.getElementById('addMessage');

      if (!title || !date) {
        showMessage(msg, '⚠️ Заполните заголовок и дату', 'error');
        return;
      }

      try {
        const snapshot = await get(ref(db, 'news'));
        let maxKey = -1;
        if (snapshot.exists()) {
          const data = snapshot.val();
          const keys = Object.keys(data).map(Number);
          maxKey = keys.length > 0 ? Math.max(...keys) : -1;
        }
        const newKey = maxKey + 1;
        await set(ref(db, 'news/' + newKey), { title, desc, date });
        showMessage(msg, `✅ Новость добавлена (индекс ${newKey})`, 'success');
        document.getElementById('addTitle').value = '';
        document.getElementById('addDesc').value = '';
        document.getElementById('addDate').value = '';
      } catch (e) {
        showMessage(msg, '❌ Ошибка: ' + e.message, 'error');
      }
    });

    // Удаление по индексу
    document.getElementById('deleteNewsBtn').addEventListener('click', async () => {
      const index = parseInt(document.getElementById('deleteIndex').value);
      const msg = document.getElementById('deleteMessage');
      if (isNaN(index) || index < 0) {
        showMessage(msg, '⚠️ Введите корректный индекс', 'error');
        return;
      }
      if (!confirm(`Удалить новость #${index}?`)) return;
      try {
        await remove(ref(db, 'news/' + index));
        showMessage(msg, '✅ Новость удалена', 'success');
        document.getElementById('deleteIndex').value = '';
      } catch (e) {
        showMessage(msg, '❌ Ошибка: ' + e.message, 'error');
      }
    });
  }

  // ----- Проверка прав администратора -----
  async function checkAdmin(user) {
    if (!user) {
      window.location.href = AUTH_URL;
      return false;
    }
    try {
      const snapshot = await get(ref(db, 'users/' + user.uid));
      if (snapshot.exists() && snapshot.val().status === 2) {
        return true;
      }
      alert('⛔ У вас нет прав администратора');
      window.location.href = 'index.html';
      return false;
    } catch (e) {
      console.error('Ошибка проверки прав:', e);
      return false;
    }
  }

  // ----- Авторизация -----
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = AUTH_URL;
      return;
    }
    renderHeader(user);
    const isAdmin = await checkAdmin(user);
    if (isAdmin) {
      initConsole();
      loadEditList();
    }
  });

  console.log('✅ Страница консоли администратора');
</script>
</body>
</html>
