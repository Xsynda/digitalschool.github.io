<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход · Электронная школа</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f8faff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 24px; }
    .auth-card { max-width: 440px; width: 100%; background: #ffffff; border-radius: 48px; box-shadow: 0 24px 60px rgba(0, 20, 40, 0.08); padding: 40px 32px 44px; border: 1px solid #f0f5fe; }
    .logo-area { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .logo-icon { background: #2a7de1; color: white; width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 600; box-shadow: 0 8px 18px rgba(42, 125, 225, 0.20); }
    .logo-text { font-size: 26px; font-weight: 600; letter-spacing: -0.3px; color: #0a1e3c; }
    .logo-text span { color: #2a7de1; }
    .auth-title { font-size: 28px; font-weight: 600; color: #0a1e3c; margin-bottom: 6px; }
    .auth-sub { font-size: 16px; color: #5f7696; margin-bottom: 28px; }
    .input-group { margin-bottom: 20px; }
    .input-group label { display: block; font-weight: 500; font-size: 14px; color: #1f2b48; margin-bottom: 6px; }
    .input-group input { width: 100%; padding: 14px 18px; border: 1.5px solid #dce4ef; border-radius: 30px; font-size: 15px; font-family: 'Inter', sans-serif; transition: 0.15s; background: #fafcff; }
    .input-group input:focus { outline: none; border-color: #2a7de1; background: white; box-shadow: 0 0 0 4px rgba(42, 125, 225, 0.10); }
    .extra-fields { display: none; animation: fadeIn 0.2s ease; }
    .extra-fields.visible { display: block; }
    @keyframes fadeIn { 0% { opacity: 0; transform: translateY(-6px); } 100% { opacity: 1; transform: translateY(0); } }
    .error-msg { color: #c74a4a; font-size: 14px; margin: 8px 0 12px; background: #fff0f0; padding: 10px 16px; border-radius: 40px; display: block; line-height: 1.4; }
    .error-msg.hidden { display: none; }
    .btn { border: none; padding: 14px 28px; border-radius: 40px; font-weight: 600; font-size: 16px; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Inter', sans-serif; width: 100%; }
    .btn-primary { background: #2a7de1; color: white; box-shadow: 0 8px 20px rgba(42, 125, 225, 0.25); }
    .btn-primary:hover:not(:disabled) { background: #1a5fb0; transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-outline { background: transparent; color: #1f2b48; border: 1.5px solid #d0dae9; margin-top: 12px; }
    .btn-outline:hover { background: #f0f4fe; border-color: #2a7de1; }
    .switch-row { margin-top: 22px; text-align: center; font-size: 15px; color: #4b6589; }
    .switch-row span { color: #2a7de1; font-weight: 600; cursor: pointer; margin-left: 4px; transition: 0.1s; }
    .switch-row span:hover { text-decoration: underline; }
    .footer-note { margin-top: 32px; font-size: 13px; color: #889bb3; text-align: center; border-top: 1px solid #eef3fa; padding-top: 20px; }
    .hidden { display: none !important; }
    .remember-me { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; font-size: 14px; color: #1f2b48; cursor: pointer; }
    .remember-me input[type="checkbox"] { width: 18px; height: 18px; accent-color: #2a7de1; cursor: pointer; }
    @media (max-width: 480px) { .auth-card { padding: 28px 20px 32px; border-radius: 32px; } .logo-text { font-size: 22px; } .logo-icon { width: 42px; height: 42px; font-size: 20px; } }
  </style>
</head>
<body>

<div class="auth-card" id="authCard">
  <div class="logo-area">
    <div class="logo-icon">Ш</div>
    <div class="logo-text">Электро<span>школа</span></div>
  </div>

  <div id="authFormBlock">
    <div class="auth-title" id="formTitle">Вход</div>
    <div class="auth-sub" id="formSub">Введите email и пароль</div>

    <div class="input-group">
      <label>Email</label>
      <input type="email" id="emailInput" placeholder="example@school.ru" />
    </div>
    <div class="input-group">
      <label>Пароль</label>
      <input type="password" id="passwordInput" placeholder="••••••••" />
    </div>

    <div class="remember-me">
      <input type="checkbox" id="rememberCheckbox" checked />
      <label for="rememberCheckbox">Запомнить меня</label>
    </div>

    <div class="extra-fields" id="extraFields">
      <div class="input-group">
        <label>Имя</label>
        <input type="text" id="nameInput" placeholder="Иван Иванов" />
      </div>
    </div>

    <div id="authError" class="error-msg hidden"></div>

    <button class="btn btn-primary" id="submitBtn">Войти</button>
    <button class="btn btn-outline" id="switchModeBtn">Зарегистрироваться</button>

    <div class="switch-row" id="switchText">
      <span id="switchActionLabel">Нет аккаунта?</span>
      <span id="switchActionBtn">Зарегистрироваться</span>
    </div>
  </div>

  <div class="footer-note">© 2026 · Электронная школа</div>
</div>

<!-- FIREBASE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-analytics.js";
  import {
    getAuth,
    onAuthStateChanged,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    setPersistence,
    browserLocalPersistence,
    browserSessionPersistence
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
  import {
    getDatabase,
    ref,
    set
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDGPv-cUMTSRBq9ZLmpDZFT-JYc3UOcCpY",
    authDomain: "digitalschool-f2c90.firebaseapp.com",
    projectId: "digitalschool-f2c90",
    storageBucket: "digitalschool-f2c90.firebasestorage.app",
    messagingSenderId: "797143730107",
    appId: "1:797143730107:web:b19437db896170d88b269e",
    measurementId: "G-FT9ENP491P"
  };

  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const auth = getAuth(app);
  const db = getDatabase(app);

  const REDIRECT_URL = 'https://xsynda.github.io/digitalschool.github.io/index.html';

  const formTitle = document.getElementById('formTitle');
  const formSub = document.getElementById('formSub');
  const emailInput = document.getElementById('emailInput');
  const passwordInput = document.getElementById('passwordInput');
  const nameInput = document.getElementById('nameInput');
  const extraFields = document.getElementById('extraFields');
  const submitBtn = document.getElementById('submitBtn');
  const switchModeBtn = document.getElementById('switchModeBtn');
  const switchActionLabel = document.getElementById('switchActionLabel');
  const switchActionBtn = document.getElementById('switchActionBtn');
  const authError = document.getElementById('authError');
  const rememberCheckbox = document.getElementById('rememberCheckbox');

  let isLoginMode = true;

  function redirectToMain() {
    window.location.href = REDIRECT_URL;
  }

  function updateFormMode() {
    if (isLoginMode) {
      formTitle.textContent = 'Вход';
      formSub.textContent = 'Введите email и пароль';
      submitBtn.textContent = 'Войти';
      switchModeBtn.textContent = 'Зарегистрироваться';
      switchActionLabel.textContent = 'Нет аккаунта?';
      switchActionBtn.textContent = 'Зарегистрироваться';
      extraFields.classList.remove('visible');
    } else {
      formTitle.textContent = 'Регистрация';
      formSub.textContent = 'Создайте новый аккаунт';
      submitBtn.textContent = 'Создать';
      switchModeBtn.textContent = 'Войти';
      switchActionLabel.textContent = 'Уже есть аккаунт?';
      switchActionBtn.textContent = 'Войти';
      extraFields.classList.add('visible');
    }
    authError.classList.add('hidden');
  }

  function toggleMode() {
    isLoginMode = !isLoginMode;
    updateFormMode();
    emailInput.value = '';
    passwordInput.value = '';
    nameInput.value = '';
    authError.classList.add('hidden');
  }

  switchModeBtn.addEventListener('click', toggleMode);
  switchActionBtn.addEventListener('click', toggleMode);

  function getErrorMessage(error) {
    const codes = {
      'auth/user-not-found': 'Пользователь с таким email не найден.',
      'auth/wrong-password': 'Неверный пароль.',
      'auth/email-already-in-use': 'Этот email уже зарегистрирован.',
      'auth/invalid-email': 'Некорректный формат email.',
      'auth/weak-password': 'Пароль слишком простой (мин. 6 символов).',
      'auth/user-disabled': 'Аккаунт отключён.',
      'auth/too-many-requests': 'Слишком много попыток. Подождите.',
      'auth/network-request-failed': 'Проблема с интернетом.',
      'auth/internal-error': 'Внутренняя ошибка сервера.'
    };
    return codes[error.code] || error.message || 'Неизвестная ошибка.';
  }

  function loadSavedEmail() {
    try {
      const saved = localStorage.getItem('remembered_email');
      if (saved) {
        emailInput.value = saved;
        rememberCheckbox.checked = true;
      }
    } catch (e) {}
  }

  // ===== ГЛАВНАЯ ФУНКЦИЯ =====
  async function handleSubmit() {
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    const name = nameInput.value.trim();

    if (!email || password.length < 6) {
      authError.textContent = '⚠️ Введите email и пароль (мин. 6 символов)';
      authError.classList.remove('hidden');
      return;
    }

    if (!isLoginMode && !name) {
      authError.textContent = '⚠️ Пожалуйста, введите имя';
      authError.classList.remove('hidden');
      return;
    }

    authError.classList.add('hidden');
    submitBtn.disabled = true;
    submitBtn.textContent = '⏳ Загрузка...';

    try {
      // Устанавливаем персистентность
      if (rememberCheckbox.checked) {
        await setPersistence(auth, browserLocalPersistence);
        localStorage.setItem('remembered_email', email);
      } else {
        await setPersistence(auth, browserSessionPersistence);
        localStorage.removeItem('remembered_email');
      }

      if (isLoginMode) {
        // ВХОД
        await signInWithEmailAndPassword(auth, email, password);
        redirectToMain();
      } else {
        // РЕГИСТРАЦИЯ — САМЫЙ ПРОСТОЙ СПОСОБ
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;
        
        // ЖДЁМ 2 СЕКУНДЫ — за это время Firebase точно успевает авторизоваться
        console.log('⏳ Ждём 2 секунды перед сохранением профиля...');
        await new Promise(resolve => setTimeout(resolve, 2000));
        
        // Теперь сохраняем профиль
        const userRef = ref(db, 'users/' + user.uid);
        const defaultName = name || email.split('@')[0];
        
        console.log('💾 Сохраняем профиль...');
        await set(userRef, {
          email: email,
          name: defaultName,
          status: 1,
          createdAt: new Date().toISOString()
        });
        
        console.log('✅ Профиль сохранён!');
        redirectToMain();
      }
    } catch (error) {
      console.error('Ошибка:', error);
      authError.textContent = '❌ ' + getErrorMessage(error);
      authError.classList.remove('hidden');
      submitBtn.disabled = false;
      submitBtn.textContent = isLoginMode ? 'Войти' : 'Создать';
    }
  }

  submitBtn.addEventListener('click', handleSubmit);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const active = document.activeElement;
      if (active === emailInput || active === passwordInput || active === nameInput) {
        handleSubmit();
      }
    }
  });

  // onAuthStateChanged — только для перенаправления уже авторизованных
  onAuthStateChanged(auth, (user) => {
    if (user) {
      console.log('👤 Уже авторизован:', user.email);
      // Если мы на странице авторизации, а пользователь уже есть — перенаправляем
      // Но только если мы не в процессе регистрации (кнопка не disabled)
      if (!submitBtn.disabled) {
        redirectToMain();
      }
    } else {
      console.log('👤 Не авторизован');
      loadSavedEmail();
      updateFormMode();
    }
  });

  // Инициализация
  updateFormMode();
  loadSavedEmail();
  console.log('✅ Страница авторизации загружена');
</script>
</body>
</html>
