<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход · Электронная школа</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f8faff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .auth-card {
      max-width: 440px;
      width: 100%;
      background: #ffffff;
      border-radius: 48px;
      box-shadow: 0 24px 60px rgba(0, 20, 40, 0.08);
      padding: 40px 32px 44px;
      border: 1px solid #f0f5fe;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .logo-icon {
      background: #2a7de1;
      color: white;
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 600;
      box-shadow: 0 8px 18px rgba(42, 125, 225, 0.20);
    }

    .logo-text {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: #0a1e3c;
    }

    .logo-text span { color: #2a7de1; }

    .auth-title {
      font-size: 28px;
      font-weight: 600;
      color: #0a1e3c;
      margin-bottom: 6px;
    }

    .auth-sub {
      font-size: 16px;
      color: #5f7696;
      margin-bottom: 28px;
    }

    .input-group { margin-bottom: 20px; }
    .input-group label {
      display: block;
      font-weight: 500;
      font-size: 14px;
      color: #1f2b48;
      margin-bottom: 6px;
    }

    .input-group input,
    .input-group select {
      width: 100%;
      padding: 14px 18px;
      border: 1.5px solid #dce4ef;
      border-radius: 30px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      transition: 0.15s;
      background: #fafcff;
      color: #1f2b48;
    }

    .input-group input:focus,
    .input-group select:focus {
      outline: none;
      border-color: #2a7de1;
      background: white;
      box-shadow: 0 0 0 4px rgba(42, 125, 225, 0.10);
    }

    .error-msg {
      color: #c74a4a;
      font-size: 14px;
      margin: 8px 0 12px;
      background: #fff0f0;
      padding: 10px 16px;
      border-radius: 40px;
      display: block;
      line-height: 1.4;
    }

    .error-msg.hidden { display: none; }

    .success-msg {
      color: #1a8a4a;
      font-size: 14px;
      margin: 8px 0 12px;
      background: #e8f5ed;
      padding: 10px 16px;
      border-radius: 40px;
      display: block;
      line-height: 1.4;
    }

    .success-msg.hidden { display: none; }

    .info-msg {
      color: #2a7de1;
      font-size: 14px;
      margin: 8px 0 12px;
      background: #e5effb;
      padding: 10px 16px;
      border-radius: 40px;
      display: block;
      line-height: 1.4;
    }

    .info-msg.hidden { display: none; }

    .btn {
      border: none;
      padding: 14px 28px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: 'Inter', sans-serif;
      width: 100%;
    }

    .btn-primary {
      background: #2a7de1;
      color: white;
      box-shadow: 0 8px 20px rgba(42, 125, 225, 0.25);
    }

    .btn-primary:hover:not(:disabled) {
      background: #1a5fb0;
      transform: scale(0.98);
    }

    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-outline {
      background: transparent;
      color: #1f2b48;
      border: 1.5px solid #d0dae9;
      margin-top: 12px;
    }

    .btn-outline:hover {
      background: #f0f4fe;
      border-color: #2a7de1;
    }

    .btn-success {
      background: #1a8a4a;
      color: white;
      box-shadow: 0 8px 20px rgba(26, 138, 74, 0.25);
    }

    .btn-success:hover {
      background: #146e3a;
      transform: scale(0.98);
    }

    .switch-row {
      margin-top: 22px;
      text-align: center;
      font-size: 15px;
      color: #4b6589;
    }

    .switch-row span {
      color: #2a7de1;
      font-weight: 600;
      cursor: pointer;
      margin-left: 4px;
      transition: 0.1s;
    }

    .switch-row span:hover { text-decoration: underline; }

    .footer-note {
      margin-top: 32px;
      font-size: 13px;
      color: #889bb3;
      text-align: center;
      border-top: 1px solid #eef3fa;
      padding-top: 20px;
    }

    .hidden { display: none !important; }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #1f2b48;
      cursor: pointer;
    }

    .remember-me input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #2a7de1;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      .auth-card { padding: 28px 20px 32px; border-radius: 32px; }
      .logo-text { font-size: 22px; }
      .logo-icon { width: 42px; height: 42px; font-size: 20px; }
    }
  </style>
</head>
<body>

  <div class="auth-card" id="authCard">
    <div class="logo-area">
      <div class="logo-icon">Ш</div>
      <div class="logo-text">Электро<span>школа</span></div>
    </div>

    <div id="authFormBlock">
      <div class="auth-title" id="formTitle">Вход</div>
      <div class="auth-sub" id="formSub">Введите email и пароль</div>

      <div class="input-group">
        <label>Email</label>
        <input type="email" id="emailInput" placeholder="example@school.ru" />
      </div>

      <div class="input-group">
        <label>Пароль</label>
        <input type="password" id="passwordInput" placeholder="••••••••" />
      </div>

      <div class="remember-me">
        <input type="checkbox" id="rememberCheckbox" checked />
        <label for="rememberCheckbox">Запомнить меня</label>
      </div>

      <div id="authError" class="error-msg hidden"></div>
      <div id="authSuccess" class="success-msg hidden"></div>
      <div id="authInfo" class="info-msg hidden"></div>

      <button class="btn btn-primary" id="submitBtn">Войти</button>
      <button class="btn btn-outline" id="switchModeBtn">Зарегистрироваться</button>

      <div class="switch-row" id="switchText">
        <span id="switchActionLabel">Нет аккаунта?</span>
        <span id="switchActionBtn">Зарегистрироваться</span>
      </div>
    </div>

    <div id="profileSetupBlock" class="hidden">
      <div class="auth-title">Заполните профиль</div>
      <div class="auth-sub">Укажите имя, школу и класс</div>

      <div class="input-group">
        <label>Имя</label>
        <input type="text" id="profileNameInput" placeholder="Иван Иванов" />
      </div>

      <div class="input-group">
        <label>Школа</label>
        <select id="schoolSelect">
          <option value="">Загрузка...</option>
        </select>
      </div>

      <div class="input-group">
        <label>Класс</label>
        <select id="classSelect">
          <option value="">Загрузка...</option>
        </select>
      </div>

      <div id="profileError" class="error-msg hidden"></div>
      <div id="profileInfo" class="info-msg hidden"></div>

      <button class="btn btn-success" id="saveProfileBtn">Сохранить профиль</button>
    </div>

    <div class="footer-note">© 2026 · Электронная школа</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-analytics.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";
    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      setPersistence,
      browserLocalPersistence,
      browserSessionPersistence
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDGPv-cUMTSRBq9ZLmpDZFT-JYc3UOcCpY",
      authDomain: "digitalschool-f2c90.firebaseapp.com",
      projectId: "digitalschool-f2c90",
      storageBucket: "digitalschool-f2c90.firebasestorage.app",
      messagingSenderId: "797143730107",
      appId: "1:797143730107:web:b19437db896170d88b269e",
      measurementId: "G-FT9ENP491P"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const REDIRECT_URL = "index.html";

    const authFormBlock = document.getElementById("authFormBlock");
    const profileSetupBlock = document.getElementById("profileSetupBlock");
    const formTitle = document.getElementById("formTitle");
    const formSub = document.getElementById("formSub");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const submitBtn = document.getElementById("submitBtn");
    const switchModeBtn = document.getElementById("switchModeBtn");
    const switchActionLabel = document.getElementById("switchActionLabel");
    const switchActionBtn = document.getElementById("switchActionBtn");
    const authError = document.getElementById("authError");
    const authSuccess = document.getElementById("authSuccess");
    const authInfo = document.getElementById("authInfo");
    const rememberCheckbox = document.getElementById("rememberCheckbox");

    const profileNameInput = document.getElementById("profileNameInput");
    const schoolSelect = document.getElementById("schoolSelect");
    const classSelect = document.getElementById("classSelect");
    const saveProfileBtn = document.getElementById("saveProfileBtn");
    const profileError = document.getElementById("profileError");
    const profileInfo = document.getElementById("profileInfo");

    let isLoginMode = true;
    let schoolOptions = [];
    let classOptions = [];
    let schoolsRawData = [];

    function redirectToMain() {
      window.location.href = REDIRECT_URL;
    }

    function updateFormMode() {
      if (isLoginMode) {
        formTitle.textContent = "Вход";
        formSub.textContent = "Введите email и пароль";
        submitBtn.textContent = "Войти";
        switchModeBtn.textContent = "Зарегистрироваться";
        switchActionLabel.textContent = "Нет аккаунта?";
        switchActionBtn.textContent = "Зарегистрироваться";
      } else {
        formTitle.textContent = "Регистрация";
        formSub.textContent = "Создайте новый аккаунт";
        submitBtn.textContent = "Создать";
        switchModeBtn.textContent = "Войти";
        switchActionLabel.textContent = "Уже есть аккаунт?";
        switchActionBtn.textContent = "Войти";
      }

      authError.classList.add("hidden");
      authSuccess.classList.add("hidden");
      authInfo.classList.add("hidden");
    }

    function toggleMode() {
      isLoginMode = !isLoginMode;
      updateFormMode();
      emailInput.value = "";
      passwordInput.value = "";
      authError.classList.add("hidden");
      authSuccess.classList.add("hidden");
      authInfo.classList.add("hidden");
    }

    switchModeBtn.addEventListener("click", toggleMode);
    switchActionBtn.addEventListener("click", toggleMode);

    function getErrorMessage(error) {
      const codes = {
        "auth/user-not-found": "Пользователь с таким email не найден.",
        "auth/wrong-password": "Неверный пароль.",
        "auth/email-already-in-use": "Этот email уже зарегистрирован.",
        "auth/invalid-email": "Некорректный формат email.",
        "auth/weak-password": "Пароль слишком простой (мин. 6 символов).",
        "auth/user-disabled": "Аккаунт отключён.",
        "auth/too-many-requests": "Слишком много попыток. Подождите.",
        "auth/network-request-failed": "Проблема с интернетом.",
        "auth/internal-error": "Внутренняя ошибка сервера."
      };
      return codes[error.code] || error.message || "Неизвестная ошибка.";
    }

    function showMessage(element, text) {
      authError.classList.add("hidden");
      authSuccess.classList.add("hidden");
      authInfo.classList.add("hidden");
      profileError.classList.add("hidden");
      profileInfo.classList.add("hidden");

      element.textContent = text;
      element.classList.remove("hidden");
    }

    function hideProfileMessages() {
      profileError.classList.add("hidden");
      profileInfo.classList.add("hidden");
    }

    function loadSavedEmail() {
      try {
        const saved = localStorage.getItem("remembered_email");
        if (saved) {
          emailInput.value = saved;
          rememberCheckbox.checked = true;
        }
      } catch (e) {}
    }

    function normalizeOptions(raw) {
      if (!raw) return [];

      if (Array.isArray(raw)) {
        return raw
          .map((item, index) => {
            if (item && typeof item === "object") {
              const id = item.id ?? String(index);
              const name = item.name ?? item.title ?? item.label ?? item.value ?? item.fullName ?? `Элемент ${index + 1}`;
              return { id: String(id), name: String(name), raw: item };
            }
            return { id: String(index), name: String(item), raw: item };
          })
          .filter(item => item && item.name);
      }

      if (typeof raw === "object") {
        return Object.entries(raw)
          .map(([id, value]) => {
            if (value && typeof value === "object") {
              const name = value.name ?? value.title ?? value.label ?? value.value ?? value.fullName ?? id;
              return { id: String(id), name: String(name), raw: value };
            }
            return { id: String(id), name: String(value), raw: value };
          })
          .filter(item => item && item.name);
      }

      return [];
    }

    function fillSelect(select, options, placeholder) {
      select.innerHTML = "";

      const emptyOption = document.createElement("option");
      emptyOption.value = "";
      emptyOption.textContent = placeholder;
      select.appendChild(emptyOption);

      if (!options.length) {
        select.disabled = true;
        return;
      }

      select.disabled = false;

      options.forEach(option => {
        const opt = document.createElement("option");
        opt.value = option.id;
        opt.textContent = option.name;
        select.appendChild(opt);
      });
    }

    function getSchoolRecordById(id) {
      if (Array.isArray(schoolsRawData)) {
        return schoolsRawData[Number(id)] ?? schoolsRawData[id];
      }

      if (typeof schoolsRawData === "object") {
        return schoolsRawData[id] ?? Object.values(schoolsRawData).find((_, index) => String(index) === String(id));
      }

      return null;
    }

    function fillClassesForSchool(schoolId) {
      const schoolRecord = getSchoolRecordById(schoolId);

      const rawClasses =
        schoolRecord?.classes ??
        schoolRecord?.classList ??
        schoolRecord?.items ??
        [];

      classOptions = normalizeOptions(rawClasses);
      fillSelect(classSelect, classOptions, "Выберите класс");

      if (!classOptions.length) {
        classSelect.value = "";
      }
    }

    async function loadProfileOptions() {
      try {
        const snapshot = await get(ref(db, "schools"));
        const data = snapshot.val() || [];

        schoolsRawData = Array.isArray(data) ? data : (typeof data === "object" ? data : []);

        schoolOptions = normalizeOptions(schoolsRawData);
        fillSelect(schoolSelect, schoolOptions, "Выберите школу");

        if (schoolOptions.length > 0) {
          const firstSchoolId = schoolOptions[0].id;
          schoolSelect.value = firstSchoolId;
          fillClassesForSchool(firstSchoolId);
        } else {
          fillSelect(classSelect, [], "Выберите класс");
        }

        schoolSelect.onchange = () => {
          fillClassesForSchool(schoolSelect.value);
        };
      } catch (error) {
        console.error("Ошибка загрузки школ:", error);
        fillSelect(schoolSelect, [], "Школы не найдены");
        fillSelect(classSelect, [], "Классы не найдены");
      }
    }

    async function showProfileSetup() {
      authFormBlock.classList.add("hidden");
      profileSetupBlock.classList.remove("hidden");
      hideProfileMessages();
      await loadProfileOptions();
      profileNameInput.focus();
    }

    async function saveProfile() {
      const user = auth.currentUser;
      if (!user) return;

      const name = profileNameInput.value.trim();
      const schoolId = schoolSelect.value;
      const classId = classSelect.value;

      if (!name) {
        showMessage(profileError, "⚠️ Введите имя");
        return;
      }

      if (!schoolId) {
        showMessage(profileError, "⚠️ Выберите школу");
        return;
      }

      if (!classId) {
        showMessage(profileError, "⚠️ Выберите класс");
        return;
      }

      const selectedSchool = schoolOptions.find(item => item.id === schoolId) || { name: schoolId };
      const selectedClass = classOptions.find(item => item.id === classId) || { name: classId };

      saveProfileBtn.disabled = true;
      saveProfileBtn.textContent = "⏳ Сохранение...";

      try {
        await set(ref(db, "users/" + user.uid), {
          email: user.email,
          name: name,
          school: selectedSchool.name,
          schoolId: schoolId,
          class: selectedClass.name,
          classId: classId,
          status: 1,
          profileComplete: true,
          createdAt: new Date().toISOString()
        });

        redirectToMain();
      } catch (error) {
        console.error("Ошибка сохранения профиля:", error);
        showMessage(profileError, "❌ Не удалось сохранить профиль. Попробуйте ещё раз.");
        saveProfileBtn.disabled = false;
        saveProfileBtn.textContent = "Сохранить профиль";
      }
    }

    saveProfileBtn.addEventListener("click", saveProfile);

    async function handleSubmit() {
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || password.length < 6) {
        showMessage(authError, "⚠️ Введите email и пароль (мин. 6 символов)");
        return;
      }

      authError.classList.add("hidden");
      authSuccess.classList.add("hidden");
      authInfo.classList.add("hidden");
      submitBtn.disabled = true;
      submitBtn.textContent = "⏳ Загрузка...";

      try {
        if (rememberCheckbox.checked) {
          await setPersistence(auth, browserLocalPersistence);
          localStorage.setItem("remembered_email", email);
        } else {
          await setPersistence(auth, browserSessionPersistence);
          localStorage.removeItem("remembered_email");
        }

        if (isLoginMode) {
          await signInWithEmailAndPassword(auth, email, password);
        } else {
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          const user = userCredential.user;

          try {
            await set(ref(db, "users/" + user.uid), {
              email: email,
              status: 1,
              profileComplete: false,
              createdAt: new Date().toISOString()
            });
          } catch (dbError) {
            console.warn("Ошибка сохранения временного профиля:", dbError);
          }

          showMessage(authSuccess, "✅ Аккаунт создан! Заполните профиль.");
          setTimeout(() => {
            showProfileSetup();
          }, 600);
        }
      } catch (error) {
        console.error("Ошибка:", error);
        showMessage(authError, "❌ " + getErrorMessage(error));
        submitBtn.disabled = false;
        submitBtn.textContent = isLoginMode ? "Войти" : "Создать";
      }
    }

    submitBtn.addEventListener("click", handleSubmit);

    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const active = document.activeElement;

        if (active === emailInput || active === passwordInput) {
          handleSubmit();
        }

        if (active === profileNameInput || active === schoolSelect || active === classSelect) {
          saveProfile();
        }
      }
    });

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        try {
          const userSnapshot = await get(ref(db, "users/" + user.uid));
          const profile = userSnapshot.val() || {};

          if (profile.profileComplete || (profile.name && profile.school && profile.class)) {
            redirectToMain();
            return;
          }

          await showProfileSetup();
        } catch (e) {
          await showProfileSetup();
        }
      } else {
        authFormBlock.classList.remove("hidden");
        profileSetupBlock.classList.add("hidden");
        loadSavedEmail();
        updateFormMode();
      }
    });

    updateFormMode();
    loadSavedEmail();
    console.log("✅ Страница авторизации готова");
  </script>
</body>
</html>
