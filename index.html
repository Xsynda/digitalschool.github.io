<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Главная · Электронная школа</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f8faff;
      min-height: 100vh;
      padding-top: 80px;
    }

    /* ----- ШАПКА ----- */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: #ffffff;
      border-bottom: 1px solid #eef3fa;
      box-shadow: 0 4px 20px rgba(0, 20, 40, 0.06);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .navbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      background: #2a7de1;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(42, 125, 225, 0.20);
    }

    .logo-text {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: #0a1e3c;
    }
    .logo-text span {
      color: #2a7de1;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-link {
      padding: 8px 18px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 14px;
      color: #1f2b48;
      text-decoration: none;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: 1.5px solid transparent;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }
    .nav-link:hover {
      background: #f0f4fe;
      border-color: #d0dae9;
    }
    .nav-link .material-symbols-outlined {
      font-size: 18px;
    }

    .navbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f0f6ff;
      padding: 6px 16px 6px 12px;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 500;
      color: #0a1e3c;
      cursor: pointer;
      transition: 0.15s;
      text-decoration: none;
      border: none;
      font-family: 'Inter', sans-serif;
    }
    .user-badge:hover {
      background: #e5effb;
      transform: scale(0.97);
    }
    .user-badge .material-symbols-outlined {
      color: #2a7de1;
      font-size: 20px;
    }

    .btn {
      border: none;
      padding: 6px 18px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Inter', sans-serif;
      text-decoration: none;
    }

    .btn-primary {
      background: #2a7de1;
      color: white;
      box-shadow: 0 4px 12px rgba(42, 125, 225, 0.20);
    }
    .btn-primary:hover {
      background: #1a5fb0;
      transform: scale(0.97);
    }

    /* ----- ОСНОВНОЙ КОНТЕНТ ----- */
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 48px;
      box-shadow: 0 24px 60px rgba(0, 20, 40, 0.08);
      padding: 32px 40px 44px;
      border: 1px solid #f0f5fe;
    }

    .section-title {
      font-size: 22px;
      font-weight: 600;
      color: #0a1e3c;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-title .material-symbols-outlined {
      color: #2a7de1;
      font-size: 28px;
    }

    .news-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .news-item {
      background: #f9fcff;
      border-radius: 24px;
      padding: 20px 24px;
      border: 1px solid #eef3fa;
      transition: 0.15s;
    }
    .news-item:hover {
      border-color: #c7d9f0;
      background: #ffffff;
    }

    .news-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .news-title {
      font-size: 18px;
      font-weight: 600;
      color: #0a1e3c;
    }

    .news-date {
      font-size: 13px;
      color: #6a7f9e;
      background: #eef3fa;
      padding: 4px 14px;
      border-radius: 40px;
      white-space: nowrap;
    }

    .news-desc {
      font-size: 15px;
      color: #3d5270;
      line-height: 1.5;
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: #6a7f9e;
    }
    .empty-state .material-symbols-outlined {
      font-size: 48px;
      color: #d0dae9;
      margin-bottom: 12px;
    }
    .empty-state h3 {
      color: #0a1e3c;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .footer {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid #eef3fa;
      font-size: 13px;
      color: #889bb3;
      text-align: center;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #6a7f9e;
    }

    /* ----- КОНСОЛЬ АДМИНИСТРАТОРА ----- */
    .admin-console {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 2px solid #eef3fa;
    }

    .admin-console .console-title {
      font-size: 18px;
      font-weight: 600;
      color: #0a1e3c;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .admin-console .console-title .material-symbols-outlined {
      color: #8b5cf6;
      font-size: 24px;
    }

    .console-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .console-card {
      background: #f9fcff;
      border-radius: 24px;
      padding: 20px 24px;
      border: 1px solid #eef3fa;
    }

    .console-card .card-label {
      font-size: 13px;
      font-weight: 500;
      color: #6a7f9e;
      margin-bottom: 4px;
    }

    .console-card input,
    .console-card textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #dce4ef;
      border-radius: 16px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      transition: 0.15s;
      background: #ffffff;
      margin-bottom: 10px;
    }

    .console-card input:focus,
    .console-card textarea:focus {
      outline: none;
      border-color: #2a7de1;
      box-shadow: 0 0 0 4px rgba(42, 125, 225, 0.10);
    }

    .console-card textarea {
      resize: vertical;
      min-height: 60px;
    }

    .console-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-console {
      border: none;
      padding: 8px 20px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Inter', sans-serif;
    }

    .btn-console-primary {
      background: #2a7de1;
      color: white;
    }
    .btn-console-primary:hover {
      background: #1a5fb0;
      transform: scale(0.97);
    }

    .btn-console-success {
      background: #1a8a4a;
      color: white;
    }
    .btn-console-success:hover {
      background: #146e3a;
      transform: scale(0.97);
    }

    .btn-console-danger {
      background: #c74a4a;
      color: white;
    }
    .btn-console-danger:hover {
      background: #a33a3a;
      transform: scale(0.97);
    }

    .btn-console-outline {
      background: transparent;
      color: #1f2b48;
      border: 1.5px solid #d0dae9;
    }
    .btn-console-outline:hover {
      background: #f0f4fe;
    }

    .console-message {
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 40px;
      margin-top: 8px;
      display: none;
    }
    .console-message.show {
      display: block;
    }
    .console-message.success {
      background: #e8f5ed;
      color: #1a8a4a;
    }
    .console-message.error {
      background: #fff0f0;
      color: #c74a4a;
    }

    .news-item-admin .admin-actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    @media (max-width: 700px) {
      .navbar {
        padding: 10px 16px;
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .navbar-left {
        flex-wrap: wrap;
        justify-content: space-between;
      }
      .nav-links {
        justify-content: flex-start;
      }
      .navbar-right {
        justify-content: flex-start;
      }
      body {
        padding-top: 130px;
      }
      .console-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 480px) {
      .container { padding: 20px 16px 28px; border-radius: 32px; }
      .navbar-left { flex-direction: column; align-items: flex-start; gap: 6px; }
    }
  </style>
</head>
<body>

<!-- ШАПКА -->
<header class="navbar" id="navbar">
  <div class="navbar-left">
    <div class="logo-area">
      <div class="logo-icon">Ш</div>
      <div class="logo-text">Электро<span>школа</span></div>
    </div>
  </div>
  <div class="navbar-right" id="userArea">
    <!-- Имя пользователя -->
  </div>
</header>

<!-- ОСНОВНОЙ КОНТЕНТ -->
<div class="container">
  <div class="section-title">
    <span class="material-symbols-outlined">newspaper</span>
    Последние новости
  </div>

  <div id="newsContainer">
    <div class="loading">⏳ Загрузка новостей...</div>
  </div>

  <!-- КОНСОЛЬ АДМИНИСТРАТОРА (скрыта по умолчанию) -->
  <div class="admin-console" id="adminConsole" style="display: none;">
    <div class="console-title">
      <span class="material-symbols-outlined">admin_panel_settings</span>
      Консоль администратора
    </div>

    <!-- Форма добавления -->
    <div class="console-grid">
      <div class="console-card">
        <div class="card-label">➕ Добавить новость</div>
        <input type="text" id="addTitle" placeholder="Заголовок" />
        <textarea id="addDesc" placeholder="Описание"></textarea>
        <input type="number" id="addDate" placeholder="Unix timestamp" />
        <button class="btn-console btn-console-success" id="addNewsBtn">➕ Добавить</button>
        <div id="addMessage" class="console-message"></div>
      </div>

      <div class="console-card">
        <div class="card-label">🗑️ Удалить новость по индексу</div>
        <input type="number" id="deleteIndex" placeholder="Индекс новости" />
        <button class="btn-console btn-console-danger" id="deleteNewsBtn">🗑️ Удалить</button>
        <div id="deleteMessage" class="console-message"></div>
      </div>
    </div>

    <!-- Редактирование существующих -->
    <div style="margin-top:16px;">
      <div class="card-label" style="font-weight:500; color:#0a1e3c; margin-bottom:12px;">✏️ Редактировать существующие</div>
      <div id="editList"></div>
    </div>
  </div>

  <div class="footer">© 2026 · Электронная школа</div>
</div>

<!-- FIREBASE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-analytics.js";
  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
  import {
    getDatabase,
    ref,
    get,
    set,
    remove,
    child,
    onValue
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDGPv-cUMTSRBq9ZLmpDZFT-JYc3UOcCpY",
    authDomain: "digitalschool-f2c90.firebaseapp.com",
    projectId: "digitalschool-f2c90",
    storageBucket: "digitalschool-f2c90.firebasestorage.app",
    messagingSenderId: "797143730107",
    appId: "1:797143730107:web:b19437db896170d88b269e",
    measurementId: "G-FT9ENP491P"
  };

  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const auth = getAuth(app);
  const db = getDatabase(app);

  const AUTH_URL = 'https://xsynda.github.io/digitalschool.github.io/auth.html';
  const ACCOUNT_URL = 'account.html';
  const NEWS_COUNT = 15;

  const userArea = document.getElementById('userArea');
  const newsContainer = document.getElementById('newsContainer');
  const adminConsole = document.getElementById('adminConsole');

  function redirectToAuth() {
    window.location.href = AUTH_URL;
  }

  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function formatDate(timestamp) {
    if (!timestamp) return '—';
    const date = new Date(timestamp * 1000);
    return date.toLocaleDateString('ru-RU', {
      day: 'numeric',
      month: 'long',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });
  }

  function showMessage(element, text, type) {
    element.textContent = text;
    element.className = 'console-message show ' + type;
    setTimeout(() => {
      element.className = 'console-message';
    }, 4000);
  }

  // ----- Рендер новостей -----
  function renderNews(newsData, isAdmin) {
    if (!newsData || Object.keys(newsData).length === 0) {
      newsContainer.innerHTML = `
        <div class="empty-state">
          <span class="material-symbols-outlined">feed_off</span>
          <h3>Новостей пока нет</h3>
          <p>Скоро здесь появятся первые новости</p>
        </div>
      `;
      return;
    }

    const keys = Object.keys(newsData).map(Number).sort((a, b) => b - a);
    const topKeys = keys.slice(0, NEWS_COUNT);

    let html = '<div class="news-list">';
    for (const key of topKeys) {
      const item = newsData[key];
      if (!item) continue;
      const title = item.title || 'Без названия';
      const desc = item.desc || '';
      const date = formatDate(item.date);
      
      html += `
        <div class="news-item ${isAdmin ? 'news-item-admin' : ''}" data-key="${key}">
          <div class="news-header">
            <div class="news-title">${escapeHtml(title)}</div>
            <div class="news-date">${date}</div>
          </div>
          ${desc ? `<div class="news-desc">${escapeHtml(desc)}</div>` : ''}
          ${isAdmin ? `
            <div class="admin-actions">
              <button class="btn-console btn-console-outline edit-news-btn" data-key="${key}">✏️ Редактировать</button>
              <button class="btn-console btn-console-danger delete-news-btn" data-key="${key}">🗑️ Удалить</button>
            </div>
          ` : ''}
        </div>
      `;
    }
    html += '</div>';
    newsContainer.innerHTML = html;

    // Обработчики для администратора
    if (isAdmin) {
      document.querySelectorAll('.edit-news-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const key = parseInt(btn.dataset.key);
          const item = newsData[key];
          if (item) {
            document.getElementById('addTitle').value = item.title || '';
            document.getElementById('addDesc').value = item.desc || '';
            document.getElementById('addDate').value = item.date || '';
            // Меняем кнопку на "Сохранить" и запоминаем ключ
            const addBtn = document.getElementById('addNewsBtn');
            addBtn.textContent = '💾 Сохранить';
            addBtn.dataset.editKey = key;
            addBtn.classList.remove('btn-console-success');
            addBtn.classList.add('btn-console-primary');
          }
        });
      });

      document.querySelectorAll('.delete-news-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const key = parseInt(btn.dataset.key);
          if (confirm(`Удалить новость #${key}?`)) {
            try {
              await remove(ref(db, 'news/' + key));
              showMessage(document.getElementById('deleteMessage'), '✅ Новость удалена', 'success');
            } catch (e) {
              showMessage(document.getElementById('deleteMessage'), '❌ Ошибка: ' + e.message, 'error');
            }
          }
        });
      });
    }
  }

  // ----- Загрузка новостей -----
  function loadNews(isAdmin) {
    const newsRef = ref(db, 'news');
    onValue(newsRef, (snapshot) => {
      if (snapshot.exists()) {
        renderNews(snapshot.val(), isAdmin);
      } else {
        renderNews(null, isAdmin);
      }
    }, (error) => {
      console.error('Ошибка загрузки новостей:', error);
      newsContainer.innerHTML = `
        <div class="empty-state">
          <span class="material-symbols-outlined">error</span>
          <h3>Ошибка загрузки</h3>
          <p>Не удалось загрузить новости. Попробуйте позже.</p>
        </div>
      `;
    });
  }

  // ----- Рендер шапки -----
  function renderHeader(user) {
    if (user) {
      const displayName = user.displayName || user.email || 'Пользователь';
      userArea.innerHTML = `
        <a href="${ACCOUNT_URL}" class="user-badge">
          <span class="material-symbols-outlined">account_circle</span>
          ${escapeHtml(displayName)}
        </a>
      `;
    } else {
      userArea.innerHTML = `
        <a href="${AUTH_URL}" class="btn btn-primary">
          <span class="material-symbols-outlined" style="font-size:18px;">login</span>
          Войти
        </a>
      `;
    }
  }

  // ----- Инициализация консоли администратора -----
  function initAdminConsole() {
    adminConsole.style.display = 'block';

    // Добавление / Сохранение
    const addBtn = document.getElementById('addNewsBtn');
    addBtn.addEventListener('click', async () => {
      const title = document.getElementById('addTitle').value.trim();
      const desc = document.getElementById('addDesc').value.trim();
      const date = parseInt(document.getElementById('addDate').value);
      const msg = document.getElementById('addMessage');

      if (!title || !date) {
        showMessage(msg, '⚠️ Заполните заголовок и дату', 'error');
        return;
      }

      const editKey = addBtn.dataset.editKey;

      try {
        if (editKey !== undefined) {
          // Редактирование существующей
          await set(ref(db, 'news/' + editKey), { title, desc, date });
          showMessage(msg, '✅ Новость обновлена', 'success');
          addBtn.textContent = '➕ Добавить';
          addBtn.dataset.editKey = undefined;
          addBtn.classList.remove('btn-console-primary');
          addBtn.classList.add('btn-console-success');
          document.getElementById('addTitle').value = '';
          document.getElementById('addDesc').value = '';
          document.getElementById('addDate').value = '';
        } else {
          // Добавление новой
          const snapshot = await get(ref(db, 'news'));
          let maxKey = -1;
          if (snapshot.exists()) {
            const data = snapshot.val();
            const keys = Object.keys(data).map(Number);
            maxKey = keys.length > 0 ? Math.max(...keys) : -1;
          }
          const newKey = maxKey + 1;
          await set(ref(db, 'news/' + newKey), { title, desc, date });
          showMessage(msg, `✅ Новость добавлена (индекс ${newKey})`, 'success');
          document.getElementById('addTitle').value = '';
          document.getElementById('addDesc').value = '';
          document.getElementById('addDate').value = '';
        }
      } catch (e) {
        showMessage(msg, '❌ Ошибка: ' + e.message, 'error');
      }
    });

    // Удаление по индексу
    document.getElementById('deleteNewsBtn').addEventListener('click', async () => {
      const index = parseInt(document.getElementById('deleteIndex').value);
      const msg = document.getElementById('deleteMessage');
      if (isNaN(index) || index < 0) {
        showMessage(msg, '⚠️ Введите корректный индекс', 'error');
        return;
      }
      if (!confirm(`Удалить новость #${index}?`)) return;
      try {
        await remove(ref(db, 'news/' + index));
        showMessage(msg, '✅ Новость удалена', 'success');
        document.getElementById('deleteIndex').value = '';
      } catch (e) {
        showMessage(msg, '❌ Ошибка: ' + e.message, 'error');
      }
    });
  }

  // ----- Загрузка данных пользователя -----
  function loadUserAndRender(user) {
    if (!user) {
      renderHeader(null);
      return;
    }

    const userRef = ref(db, 'users/' + user.uid);
    get(userRef).then((snapshot) => {
      let isAdmin = false;
      let displayName = user.email;
      if (snapshot.exists()) {
        const data = snapshot.val();
        displayName = data.name || user.email;
        isAdmin = (data.status === 2); // Администратор = статус 2
      }
      user.displayName = displayName;
      renderHeader(user);
      
      // Показываем консоль для администратора
      if (isAdmin) {
        adminConsole.style.display = 'block';
        if (!adminConsole.dataset.initialized) {
          initAdminConsole();
          adminConsole.dataset.initialized = 'true';
        }
        // Загружаем новости с админ-режимом
        loadNews(true);
      } else {
        adminConsole.style.display = 'none';
        loadNews(false);
      }
    }).catch((err) => {
      console.warn('Ошибка получения профиля:', err);
      renderHeader(user);
      loadNews(false);
    });
  }

  // ----- Авторизация -----
  onAuthStateChanged(auth, (user) => {
    if (user) {
      loadUserAndRender(user);
    } else {
      redirectToAuth();
    }
  });

  console.log('✅ Главная страница с консолью администратора');
</script>
</body>
</html>
