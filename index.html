<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Главная · Электронная школа</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f8faff; min-height: 100vh; padding-top: 80px; }
    .navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: #fff; border-bottom: 1px solid #eef3fa; box-shadow: 0 4px 20px rgba(0,20,40,.06); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .navbar-left { display: flex; align-items: center; gap: 16px; }
    .logo-area { display: flex; align-items: center; gap: 10px; }
    .logo-icon { background:#2a7de1; color:#fff; width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:600; box-shadow:0 4px 12px rgba(42,125,225,.20); }
    .logo-text { font-size:22px; font-weight:600; letter-spacing:-.3px; color:#0a1e3c; }
    .logo-text span { color:#2a7de1; }
    .nav-links { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .nav-link { padding:8px 18px; border-radius:40px; font-weight:500; font-size:14px; color:#1f2b48; text-decoration:none; transition:.15s; display:inline-flex; align-items:center; gap:6px; background:transparent; border:1.5px solid transparent; }
    .nav-link:hover { background:#f0f4fe; border-color:#d0dae9; }
    .nav-link .material-symbols-outlined { font-size:18px; }
    .navbar-right { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .user-badge { display:flex; align-items:center; gap:8px; background:#f0f6ff; padding:6px 16px 6px 12px; border-radius:40px; font-size:14px; font-weight:500; color:#0a1e3c; cursor:pointer; transition:.15s; text-decoration:none; border:none; font-family:'Inter',sans-serif; }
    .user-badge:hover { background:#e5effb; transform:scale(.97); }
    .user-badge .material-symbols-outlined { color:#2a7de1; font-size:20px; }
    .btn { border:none; padding:6px 18px; border-radius:40px; font-weight:500; font-size:13px; cursor:pointer; transition:.2s; display:inline-flex; align-items:center; gap:6px; font-family:'Inter',sans-serif; text-decoration:none; }
    .btn-primary { background:#2a7de1; color:#fff; box-shadow:0 4px 12px rgba(42,125,225,.20); }
    .btn-primary:hover { background:#1a5fb0; transform:scale(.97); }
    .container { max-width:900px; margin:0 auto; background:#fff; border-radius:48px; box-shadow:0 24px 60px rgba(0,20,40,.08); padding:32px 40px 44px; border:1px solid #f0f5fe; }
    .section-title { font-size:22px; font-weight:600; color:#0a1e3c; margin-bottom:20px; display:flex; align-items:center; gap:10px; }
    .section-title .material-symbols-outlined { color:#2a7de1; font-size:28px; }
    .news-list { display:flex; flex-direction:column; gap:16px; }
    .news-item { background:#f9fcff; border-radius:24px; padding:20px 24px; border:1px solid #eef3fa; transition:.15s; cursor:pointer; }
    .news-item:hover { border-color:#c7d9f0; background:#fff; }
    .news-header { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:8px; }
    .news-title { font-size:18px; font-weight:600; color:#0a1e3c; }
    .news-date { font-size:13px; color:#6a7f9e; background:#eef3fa; padding:4px 14px; border-radius:40px; white-space:nowrap; }
    .news-desc { font-size:15px; color:#3d5270; line-height:1.5; word-break:break-word; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; text-overflow:ellipsis; max-height:4.5em; }
    .empty-state { text-align:center; padding:48px 20px; color:#6a7f9e; }
    .empty-state .material-symbols-outlined { font-size:48px; color:#d0dae9; margin-bottom:12px; }
    .empty-state h3 { color:#0a1e3c; font-weight:500; margin-bottom:4px; }
    .footer { margin-top:32px; padding-top:20px; border-top:1px solid #eef3fa; font-size:13px; color:#889bb3; text-align:center; }
    .loading { text-align:center; padding:40px; color:#6a7f9e; }

    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); backdrop-filter:blur(4px); align-items:center; justify-content:center; z-index:9999; padding:20px; }
    .modal-overlay.open { display:flex; }
    .modal-box { background:#fff; max-width:520px; width:100%; padding:32px 28px 28px; border-radius:32px; box-shadow:0 30px 60px rgba(0,0,0,.2); max-height:80vh; overflow-y:auto; animation:pop .2s ease; }
    @keyframes pop { from { transform:scale(.95) translateY(10px); opacity:0; } to { transform:scale(1) translateY(0); opacity:1; } }
    .modal-box .m-title { font-size:22px; font-weight:700; color:#0a1e3c; margin-bottom:4px; }
    .modal-box .m-date { font-size:14px; color:#6a7f9e; margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid #eef3fa; }
    .modal-box .m-text { font-size:15px; color:#1f2b48; line-height:1.7; word-break:break-word; overflow-wrap:anywhere; white-space:pre-wrap; }
    .modal-box .m-close { margin-top:24px; width:100%; padding:14px; border:none; border-radius:40px; background:#eef3fa; color:#1f2b48; font-weight:600; font-size:16px; cursor:pointer; font-family:'Inter',sans-serif; transition:.15s; }
    .modal-box .m-close:hover { background:#dce4ef; }

    @media (max-width:700px) {
      .navbar { padding:10px 16px; flex-direction:column; align-items:stretch; gap:8px; }
      .navbar-left { flex-wrap:wrap; justify-content:space-between; }
      .nav-links { justify-content:flex-start; }
      .navbar-right { justify-content:flex-start; }
      body { padding-top:130px; }
    }
    @media (max-width:480px) {
      .container { padding:20px 16px 28px; border-radius:32px; }
      .navbar-left { flex-direction:column; align-items:flex-start; gap:6px; }
      .modal-box { padding:24px 20px; max-height:85vh; }
    }
  </style>
</head>
<body>

<header class="navbar" id="navbar">
  <div class="navbar-left">
    <div class="logo-area">
      <div class="logo-icon">Ш</div>
      <div class="logo-text">Электро<span>школа</span></div>
    </div>
    <nav class="nav-links" id="navLinks">
      <a href="diary.html" class="nav-link">
        <span class="material-symbols-outlined">calendar_month</span> Дневник
      </a>
    </nav>
  </div>
  <div class="navbar-right" id="userArea"></div>
</header>

<div class="container">
  <div class="section-title">
    <span class="material-symbols-outlined">newspaper</span> Последние новости
  </div>
  <div id="newsContainer">
    <div class="loading">⏳ Загрузка новостей...</div>
  </div>
  <div class="footer">© 2026 · Электронная школа</div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="m-title" id="modalTitle">Заголовок</div>
    <div class="m-date" id="modalDate">Дата</div>
    <div class="m-text" id="modalText">Текст</div>
    <button class="m-close" id="modalClose">Закрыть</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-analytics.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
  import { getDatabase, ref, get, set, onValue } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDGPv-cUMTSRBq9ZLmpDZFT-JYc3UOcCpY",
    authDomain: "digitalschool-f2c90.firebaseapp.com",
    projectId: "digitalschool-f2c90",
    storageBucket: "digitalschool-f2c90.firebasestorage.app",
    messagingSenderId: "797143730107",
    appId: "1:797143730107:web:b19437db896170d88b269e",
    measurementId: "G-FT9ENP491P"
  };

  const app = initializeApp(firebaseConfig);
  getAnalytics(app);
  const auth = getAuth(app);
  const db = getDatabase(app);

  const AUTH_URL = "https://xsynda.github.io/digitalschool.github.io/auth.html";
  const ACCOUNT_URL = "account.html";
  const CONSOLE_URL = "console.html";
  const NEWS_COUNT = 15;

  const navLinks = document.getElementById("navLinks");
  const userArea = document.getElementById("userArea");
  const newsContainer = document.getElementById("newsContainer");

  const modal = document.getElementById("modal");
  const modalTitle = document.getElementById("modalTitle");
  const modalDate = document.getElementById("modalDate");
  const modalText = document.getElementById("modalText");
  const modalClose = document.getElementById("modalClose");

  function openModal(title, date, text) {
    modalTitle.textContent = title || "Без названия";
    modalDate.textContent = date || "";
    modalText.textContent = text || "Нет текста";
    modal.classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function closeModal() {
    modal.classList.remove("open");
    document.body.style.overflow = "";
  }

  modalClose.addEventListener("click", closeModal);
  modal.addEventListener("click", (e) => {
    if (e.target === modal) closeModal();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeModal();
  });

  function escapeHtml(text) {
    if (text === null || text === undefined) return "";
    const div = document.createElement("div");
    div.textContent = String(text);
    return div.innerHTML;
  }

  function formatDate(timestamp) {
    if (!timestamp) return "—";
    return new Date(timestamp * 1000).toLocaleString("ru-RU", {
      day: "numeric",
      month: "long",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    });
  }

  async function ensureProfile(user) {
    if (!user) return;

    try {
      const userRef = ref(db, "users/" + user.uid);
      const snapshot = await get(userRef);

      if (!snapshot.exists()) {
        const name = localStorage.getItem("pending_user_name") || user.email.split("@")[0];
        localStorage.removeItem("pending_user_name");

        await set(userRef, {
          email: user.email,
          name: name,
          status: 1,
          createdAt: new Date().toISOString()
        });

        user.displayName = name;
      } else {
        user.displayName = snapshot.val().name || user.email;
      }
    } catch (error) {
      console.error("Ошибка профиля:", error);
    }
  }

  function renderNews(data) {
    if (!data || Object.keys(data).length === 0) {
      newsContainer.innerHTML = `
        <div class="empty-state">
          <span class="material-symbols-outlined">feed_off</span>
          <h3>Новостей пока нет</h3>
        </div>
      `;
      return;
    }

    const keys = Object.keys(data).map(Number).sort((a, b) => b - a);
    const topKeys = keys.slice(0, NEWS_COUNT);

    newsContainer.innerHTML = '<div class="news-list"></div>';
    const newsList = newsContainer.querySelector(".news-list");

    for (const key of topKeys) {
      const item = data[key];
      if (!item) continue;

      const title = item.title || "Без названия";
      const fullText = item.desc || "";
      const date = formatDate(item.date);
      const rawDate = item.date
        ? new Date(item.date * 1000).toLocaleString("ru-RU")
        : "";

      const newsItem = document.createElement("div");
      newsItem.className = "news-item";

      const header = document.createElement("div");
      header.className = "news-header";

      const titleElement = document.createElement("div");
      titleElement.className = "news-title";
      titleElement.textContent = title;

      const dateElement = document.createElement("div");
      dateElement.className = "news-date";
      dateElement.textContent = date;

      header.appendChild(titleElement);
      header.appendChild(dateElement);

      const descElement = document.createElement("div");
      descElement.className = "news-desc";
      descElement.textContent = fullText;

      newsItem.appendChild(header);
      newsItem.appendChild(descElement);

      newsItem.addEventListener("click", () => {
        openModal(title, rawDate, fullText);
      });

      newsList.appendChild(newsItem);
    }
  }

  function loadNews() {
    const newsRef = ref(db, "news");

    onValue(newsRef, (snapshot) => {
      if (snapshot.exists()) {
        renderNews(snapshot.val());
      } else {
        renderNews(null);
      }
    }, (error) => {
      console.error("Ошибка загрузки новостей:", error);

      newsContainer.innerHTML = `
        <div class="empty-state">
          <span class="material-symbols-outlined">error</span>
          <h3>Ошибка загрузки</h3>
        </div>
      `;
    });
  }

  function renderHeader(user, isAdmin) {
    if (isAdmin) {
      navLinks.innerHTML = `
        <a href="diary.html" class="nav-link">
          <span class="material-symbols-outlined">calendar_month</span> Дневник
        </a>
        <a href="${CONSOLE_URL}" class="nav-link">
          <span class="material-symbols-outlined">admin_panel_settings</span> Консоль
        </a>
      `;
    } else {
      navLinks.innerHTML = `
        <a href="diary.html" class="nav-link">
          <span class="material-symbols-outlined">calendar_month</span> Дневник
        </a>
      `;
    }

    if (user) {
      const displayName = user.displayName || user.email || "Пользователь";

      userArea.innerHTML = `
        <a href="${ACCOUNT_URL}" class="user-badge">
          <span class="material-symbols-outlined">account_circle</span>
          ${escapeHtml(displayName)}
        </a>
      `;
    } else {
      userArea.innerHTML = `
        <a href="${AUTH_URL}" class="btn btn-primary">
          <span class="material-symbols-outlined" style="font-size:18px;">login</span>
          Войти
        </a>
      `;
    }
  }

  async function loadUser(user) {
    if (!user) {
      renderHeader(null, false);
      return;
    }

    try {
      const snapshot = await get(ref(db, "users/" + user.uid));

      if (snapshot.exists()) {
        const data = snapshot.val();
        user.displayName = data.name || user.email;
        renderHeader(user, data.status === 2);
      } else {
        renderHeader(user, false);
      }
    } catch (error) {
      console.warn("Ошибка загрузки пользователя:", error);
      renderHeader(user, false);
    }
  }

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      await ensureProfile(user);
      await loadUser(user);
      loadNews();
    } else {
      window.location.href = AUTH_URL;
    }
  });

  console.log("Главная страница готова");
</script>

</body>
</html>
