<!DOCTYPE html>
<html lang="ru">
<head>
  <link rel="icon" type="image/png" href="logo.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Главная · Электронная школа</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Inter", sans-serif;
      background: #f8faff;
      min-height: 100vh;
      padding-top: 80px;
    }

    body.profile-required {
      overflow: hidden;
    }

    body.profile-required .navbar,
    body.profile-required .container {
      filter: blur(1px);
      pointer-events: none;
      user-select: none;
    }

    /* ===== Навигация ===== */
    .navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      background: #ffffff;
      border-bottom: 1px solid #eef3fa;
      box-shadow: 0 4px 20px rgba(0, 20, 40, 0.06);
      padding: 10px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .navbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      flex-shrink: 0;
    }

    .logo-img {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      object-fit: cover;
      display: block;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(42, 125, 225, 0.18);
      background: #ffffff;
    }

    .logo-text {
      font-size: 22px; font-weight: 700; letter-spacing: -0.3px; color: #0a1e3c;
      white-space: nowrap;
    }

    .logo-text span { color: #2a7de1; }

    .nav-links {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }

    .nav-link {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 18px; border-radius: 40px; font-weight: 500;
      font-size: 14px; color: #1f2b48; text-decoration: none;
      background: transparent; border: 1.5px solid transparent;
      transition: .15s ease;
      white-space: nowrap;
    }

    .nav-link:hover {
      background: #f0f4fe; border-color: #d0dae9;
    }

    .nav-link.active {
      background: #e5effb; border-color: #2a7de1; color: #2a7de1;
    }

    .nav-link .material-symbols-outlined {
      font-size: 18px;
    }

    .nav-link.admin-link {
      background: #fff3e0;
      border-color: #ff9800;
      color: #e65100;
    }

    .nav-link.admin-link:hover {
      background: #ffe0b2;
      border-color: #f57c00;
    }

    .navbar-right {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      flex-shrink: 0;
    }

    .user-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: #f0f6ff; padding: 6px 16px 6px 12px; border-radius: 40px;
      font-size: 14px; font-weight: 500; color: #0a1e3c; text-decoration: none;
      transition: .15s ease;
      cursor: pointer;
      border: none;
      font-family: "Inter", sans-serif;
      max-width: 220px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-badge:hover {
      background: #e5effb; transform: scale(.97);
    }

    .user-badge .material-symbols-outlined {
      color: #2a7de1; font-size: 20px; flex-shrink: 0;
    }

    .user-badge .user-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn {
      border: none; padding: 6px 18px; border-radius: 40px;
      font-weight: 500; font-size: 13px; cursor: pointer;
      transition: .2s ease; display: inline-flex; align-items: center; gap: 6px;
      font-family: "Inter", sans-serif; text-decoration: none;
    }

    .btn-primary {
      background: #2a7de1; color: #fff;
      box-shadow: 0 4px 12px rgba(42,125,225,.2);
    }

    .btn-primary:hover {
      background: #1a5fb0; transform: scale(.97);
    }

    /* ===== Контейнер ===== */
    .container {
      max-width: 900px; margin: 0 auto;
      background: #fff; border-radius: 48px;
      box-shadow: 0 24px 60px rgba(0,20,40,.08);
      padding: 32px 40px 44px;
      border: 1px solid #f0f5fe;
    }

    .section-title {
      font-size: 22px; font-weight: 600; color: #0a1e3c;
      margin-bottom: 20px; display: flex; align-items: center; gap: 10px;
    }

    .section-title .material-symbols-outlined {
      color: #2a7de1; font-size: 28px;
    }

    .news-list {
      display: flex; flex-direction: column; gap: 16px;
    }

    .news-item {
      background: #f9fcff; border-radius: 24px; padding: 20px 24px;
      border: 1px solid #eef3fa; transition: .15s ease; cursor: pointer;
    }

    .news-item:hover {
      border-color: #c7d9f0; background: #fff;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0,20,40,.06);
    }

    .news-item:active {
      transform: scale(0.98);
    }

    .news-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 12px; flex-wrap: wrap; margin-bottom: 8px;
    }

    .news-title {
      font-size: 18px; font-weight: 600; color: #0a1e3c;
    }

    .news-date {
      font-size: 13px; color: #6a7f9e; background: #eef3fa;
      padding: 4px 14px; border-radius: 40px; white-space: nowrap;
    }

    .news-desc {
      font-size: 15px; color: #3d5270; line-height: 1.6;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      max-height: 4.8em;
    }

    .news-desc-full {
      font-size: 15px; color: #3d5270; line-height: 1.7;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .news-item .news-desc-full {
      display: none;
    }

    .news-item.expanded .news-desc {
      display: none;
    }

    .news-item.expanded .news-desc-full {
      display: block;
    }

    .news-desc a, .news-desc-full a {
      color: #2a7de1;
      text-decoration: underline;
    }

    .news-desc a:hover, .news-desc-full a:hover {
      text-decoration: none;
    }

    /* ===== Кнопка "Показать ещё" ===== */
    .show-more-wrap {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    .show-more-btn {
      border: 2px dashed #d0dae9;
      background: transparent;
      color: #5f7696;
      padding: 12px 26px;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 500;
      font-family: "Inter", sans-serif;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .show-more-btn:hover {
      background: #f0f6ff;
      border-color: #2a7de1;
      color: #2a7de1;
    }

    .show-more-btn .material-symbols-outlined {
      font-size: 18px;
    }

    .empty-state {
      text-align: center; padding: 48px 20px; color: #6a7f9e;
    }

    .empty-state .material-symbols-outlined {
      font-size: 48px; color: #d0dae9; margin-bottom: 12px;
    }

    .empty-state h3 {
      color: #0a1e3c; font-weight: 500; margin-bottom: 4px;
    }

    .footer {
      margin-top: 32px; padding-top: 20px; border-top: 1px solid #eef3fa;
      font-size: 13px; color: #889bb3; text-align: center;
    }

    .loading {
      text-align: center; padding: 40px; color: #6a7f9e;
    }

    /* ===== Модальные окна ===== */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.4); backdrop-filter: blur(4px);
      align-items: center; justify-content: center; z-index: 9999; padding: 20px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      background: #fff; max-width: 520px; width: 100%;
      padding: 32px 28px 28px; border-radius: 32px;
      box-shadow: 0 30px 60px rgba(0,0,0,.2);
      max-height: 80vh; overflow-y: auto;
      animation: pop .2s ease;
    }

    @keyframes pop {
      from { transform: scale(.95) translateY(10px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    .modal-box .m-title {
      font-size: 22px; font-weight: 700; color: #0a1e3c; margin-bottom: 4px;
    }

    .modal-box .m-date {
      font-size: 14px; color: #6a7f9e; margin-bottom: 16px;
      padding-bottom: 12px; border-bottom: 1px solid #eef3fa;
    }

    .modal-box .m-text {
      font-size: 15px; color: #1f2b48; line-height: 1.7;
      word-break: break-word; overflow-wrap: anywhere;
    }

    .modal-box .m-text a {
      color: #2a7de1;
      text-decoration: underline;
    }

    .modal-box .m-text a:hover {
      text-decoration: none;
    }

    .modal-box .m-close {
      margin-top: 24px; width: 100%; padding: 14px; border: none;
      border-radius: 40px; background: #eef3fa; color: #1f2b48;
      font-weight: 600; font-size: 16px; cursor: pointer;
      font-family: "Inter", sans-serif; transition: .15s ease;
    }

    .modal-box .m-close:hover {
      background: #dce4ef;
    }

    .profile-form {
      display: flex; flex-direction: column; gap: 16px;
    }

    .field-group {
      display: flex; flex-direction: column; gap: 8px;
    }

    .field-group label {
      font-size: 13px; font-weight: 600; color: #20314d;
    }

    .field-group input, .field-group select {
      width: 100%; padding: 12px 14px; border: 1px solid #dfe9f7;
      border-radius: 14px; background: #f9fbff; color: #0d1d34;
      font-size: 15px; font-family: "Inter", sans-serif; outline: none;
    }

    .field-group input:focus, .field-group select:focus {
      border-color: #2a7de1; box-shadow: 0 0 0 3px rgba(42,125,225,.12);
    }

    .profile-actions {
      display: flex; justify-content: flex-end; margin-top: 4px;
    }

    .profile-submit {
      width: 100%; justify-content: center; padding: 14px 18px; font-size: 15px;
    }

    .hidden {
      display: none !important;
    }

    /* ===== Адаптив: планшет ===== */
    @media (max-width: 860px) {
      .navbar { padding: 10px 18px; }
      .logo-text { font-size: 20px; }
      .nav-link { padding: 7px 14px; font-size: 13px; }
      .user-badge { max-width: 160px; padding: 6px 12px 6px 10px; font-size: 13px; }
    }

    /* ===== Адаптив: мобильный ===== */
    @media (max-width: 700px) {
      body { padding-top: 74px; }

      .navbar {
        padding: 8px 14px;
        flex-wrap: nowrap;
        gap: 8px;
      }

      .navbar-left {
        flex-wrap: nowrap;
        gap: 8px;
        flex: 1;
        min-width: 0;
      }

      .logo-area { gap: 8px; flex-shrink: 0; }
      .logo-img { width: 36px; height: 36px; border-radius: 10px; }
      .logo-text { display: none; }

      .nav-links {
        flex-wrap: nowrap;
        overflow-x: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
        gap: 4px;
        flex: 1;
        min-width: 0;
      }
      .nav-links::-webkit-scrollbar { display: none; }

      .nav-link {
        padding: 7px 14px;
        font-size: 13px;
        flex-shrink: 0;
      }
      .nav-link .material-symbols-outlined { font-size: 16px; }

      .navbar-right { flex-shrink: 0; }

      .user-badge {
        padding: 6px 12px 6px 10px;
        font-size: 13px;
        max-width: 130px;
      }
      .user-badge .material-symbols-outlined { font-size: 18px; }

      .container { margin: 12px 10px 20px; padding: 20px 16px 28px; border-radius: 32px; }
      .section-title { font-size: 20px; }
      .section-title .material-symbols-outlined { font-size: 24px; }
    }

    @media (max-width: 480px) {
      .container { padding: 20px 16px 28px; border-radius: 32px; }
      .modal-box { padding: 24px 20px; max-height: 85vh; }
      .news-item { padding: 16px 18px; }
      .news-title { font-size: 16px; }
    }

    @media (max-width: 420px) {
      .user-badge .user-name { display: none; }
      .user-badge { padding: 6px 8px; max-width: none; }
      .user-badge .material-symbols-outlined { margin: 0; }

      .nav-link { padding: 6px 12px; font-size: 12px; }
      .nav-link .material-symbols-outlined { font-size: 15px; }
    }
  </style>
</head>
<body>
  <header class="navbar" id="navbar">
    <div class="navbar-left">
      <a href="index.html" class="logo-area">
        <img src="logo.png" alt="Электронная школа" class="logo-img" />
        <div class="logo-text">Электро<span>школа</span></div>
      </a>

      <nav class="nav-links" id="navLinks">
        <a href="diary.html" class="nav-link">
          <span class="material-symbols-outlined">calendar_month</span> Дневник
        </a>
        <a href="console.html" class="nav-link admin-link hidden" id="consoleLink">
          <span class="material-symbols-outlined">dashboard</span> Консоль
        </a>
      </nav>
    </div>

    <div class="navbar-right" id="userArea"></div>
  </header>

  <div class="container">
    <div class="section-title">
      <span class="material-symbols-outlined">newspaper</span> Последние новости
    </div>

    <div id="newsContainer">
      <div class="loading">⏳ Загрузка новостей...</div>
    </div>

    <div class="footer">© 2026 · Электронная школа</div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal-box">
      <div class="m-title" id="modalTitle">Заголовок</div>
      <div class="m-date" id="modalDate">Дата</div>
      <div class="m-text" id="modalText">Текст</div>
      <button class="m-close" id="modalClose">Закрыть</button>
    </div>
  </div>

  <div class="modal-overlay" id="profileModal" style="display: none;">
    <div class="modal-box">
      <div class="m-title">Заполните профиль</div>
      <div class="m-date">Чтобы продолжить, укажите имя, школу и класс.</div>

      <form id="profileForm" class="profile-form">
        <div class="field-group">
          <label for="profileName">Имя</label>
          <input id="profileName" type="text" placeholder="Введите имя" maxlength="50" required />
        </div>

        <div class="field-group">
          <label for="profileSchool">Школа</label>
          <select id="profileSchool" required>
            <option value="" selected disabled>Загрузка...</option>
          </select>
        </div>

        <div class="field-group">
          <label for="profileClass">Класс</label>
          <select id="profileClass" required>
            <option value="" selected disabled>Загрузка...</option>
          </select>
        </div>

        <div class="profile-actions">
          <button type="submit" class="btn btn-primary profile-submit">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
    import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDGPv-cUMTSRBq9ZLmpDZFT-JYc3UOcCpY",
      authDomain: "digitalschool-f2c90.firebaseapp.com",
      projectId: "digitalschool-f2c90",
      storageBucket: "digitalschool-f2c90.appspot.com",
      messagingSenderId: "797143730107",
      appId: "1:797143730107:web:b19437db896170d88b269e",
      measurementId: "G-FT9ENP491P"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const userArea = document.getElementById("userArea");
    const profileModal = document.getElementById("profileModal");
    const profileForm = document.getElementById("profileForm");
    const profileNameInput = document.getElementById("profileName");
    const profileSchoolSelect = document.getElementById("profileSchool");
    const profileClassSelect = document.getElementById("profileClass");
    const newsContainer = document.getElementById("newsContainer");
    const consoleLink = document.getElementById("consoleLink");
    const modal = document.getElementById("modal");
    const modalTitle = document.getElementById("modalTitle");
    const modalDate = document.getElementById("modalDate");
    const modalText = document.getElementById("modalText");
    const modalClose = document.getElementById("modalClose");

    let currentUser = null;
    let currentProfile = {};
    let schoolsData = [];

    // Пагинация новостей
    let allNews = [];          // отсортированный массив новостей
    let newsShown = 5;         // сколько показываем сейчас
    const NEWS_STEP = 5;

    function escapeHtml(value) {
      if (value === null || value === undefined) return "";
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function sanitizeHtml(value) {
      if (value === null || value === undefined) return "";
      let result = String(value);
      result = result.replace(/\n/g, "<br>");
      result = result.replace(/<br>/g, "___BR___");
      result = result.replace(/<br \/>/g, "___BR___");
      result = result.replace(/<a /g, "___A_OPEN___");
      result = result.replace(/<\/a>/g, "___A_CLOSE___");
      result = result
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
      result = result.replace(/___BR___/g, "<br>");
      result = result.replace(/___A_OPEN___/g, "<a ");
      result = result.replace(/___A_CLOSE___/g, "</a>");
      return result;
    }

    function formatDateTime(timestamp) {
      const date = new Date(Number(timestamp) * 1000);
      const options = {
        day: "numeric",
        month: "long",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      };
      return date.toLocaleDateString("ru-RU", options);
    }

    function formatDateShort(timestamp) {
      const date = new Date(Number(timestamp) * 1000);
      const options = {
        day: "numeric",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      };
      return date.toLocaleDateString("ru-RU", options);
    }

    function renderHeader(user) {
      const profileName = currentProfile?.name || user?.displayName || user?.email || "Пользователь";
      userArea.innerHTML = `
        <a href="account.html" class="user-badge">
          <span class="material-symbols-outlined">person</span>
          <span class="user-name">${escapeHtml(profileName)}</span>
        </a>
      `;
    }

    function updateConsoleLink() {
      const status = Number(currentProfile?.status ?? 1);
      if (status === 2 || status === 3) {
        consoleLink.classList.remove("hidden");
      } else {
        consoleLink.classList.add("hidden");
      }
    }

    function openNewsModal(title, date, text) {
      modalTitle.textContent = title;
      modalDate.textContent = date;
      modalText.innerHTML = text;
      modal.classList.add("open");
    }

    modalClose.addEventListener("click", () => {
      modal.classList.remove("open");
    });

    modal.addEventListener("click", (e) => {
      if (e.target === modal) {
        modal.classList.remove("open");
      }
    });

    async function loadSchools() {
      try {
        const snapshot = await get(ref(db, "schools"));
        const raw = snapshot.exists() ? snapshot.val() : [];
        schoolsData = Array.isArray(raw) ? raw : Object.values(raw || {});
      } catch (error) {
        console.error("schools load error:", error);
        schoolsData = [];
      }

      profileSchoolSelect.innerHTML = '<option value="" disabled selected>Выберите школу</option>';
      schoolsData.forEach((school, index) => {
        const schoolName = String(school?.name || school?.title || school?.schoolName || "").trim();
        if (!schoolName) return;

        const option = document.createElement("option");
        option.value = String(index);
        option.textContent = schoolName;
        option.dataset.schoolName = schoolName;
        profileSchoolSelect.appendChild(option);
      });
    }

    function getSchoolIndexByName(name) {
      const target = String(name || "").trim();
      if (!target) return -1;

      return schoolsData.findIndex((school) => {
        const schoolName = String(school?.name || school?.title || school?.schoolName || "").trim();
        return schoolName === target;
      });
    }

    function getSchoolByIndex(index) {
      const idx = Number(index);
      if (!Number.isInteger(idx) || idx < 0 || idx >= schoolsData.length) return null;
      return schoolsData[idx];
    }

    function getClassIndexByName(school, className) {
      if (!school || !Array.isArray(school.classes)) return -1;
      const target = String(className || "").trim();
      if (!target) return -1;

      return school.classes.findIndex((item) => {
        const name = String(item?.name || item?.title || item?.className || "").trim();
        return name === target;
      });
    }

    function updateClassOptionsForSelectedSchool() {
      const schoolIndex = Number(profileSchoolSelect.value);
      const school = getSchoolByIndex(schoolIndex);
      const classList = Array.isArray(school?.classes) ? school.classes : [];

      profileClassSelect.innerHTML = '<option value="" disabled selected>Выберите класс</option>';

      classList.forEach((item, index) => {
        const className = String(item?.name || item?.title || item?.className || "").trim();
        if (!className) return;

        const option = document.createElement("option");
        option.value = String(index);
        option.textContent = className;
        option.dataset.className = className;
        profileClassSelect.appendChild(option);
      });
    }

    function openProfileSetupModal(profile = {}) {
      const data = profile || {};
      profileNameInput.value = data.name || currentUser?.displayName || "";

      const savedSchoolName = String(data.school || "").trim();
      const savedClassName = String(data.class || "").trim();

      profileSchoolSelect.innerHTML = '<option value="" disabled selected>Выберите школу</option>';
      schoolsData.forEach((school, index) => {
        const schoolName = String(school?.name || school?.title || school?.schoolName || "").trim();
        if (!schoolName) return;

        const option = document.createElement("option");
        option.value = String(index);
        option.textContent = schoolName;
        option.dataset.schoolName = schoolName;

        if (savedSchoolName && schoolName === savedSchoolName) option.selected = true;
        profileSchoolSelect.appendChild(option);
      });

      updateClassOptionsForSelectedSchool();

      if (savedClassName) {
        const school = getSchoolByIndex(profileSchoolSelect.value);
        const matchIndex = getClassIndexByName(school, savedClassName);

        if (matchIndex >= 0) {
          profileClassSelect.value = String(matchIndex);
        }
      }

      profileModal.style.display = "flex";
      profileModal.classList.add("open");
      document.body.classList.add("profile-required");
    }

    function closeProfileSetupModal() {
      profileModal.style.display = "none";
      profileModal.classList.remove("open");
      document.body.classList.remove("profile-required");
    }

    async function saveProfileData(user, data) {
      if (!user) throw new Error("Пользователь не найден");

      const schoolIndex = Number(profileSchoolSelect.value);
      const classIndex = Number(profileClassSelect.value);

      if (!Number.isInteger(schoolIndex) || schoolIndex < 0) {
        throw new Error("Выберите школу");
      }
      if (!Number.isInteger(classIndex) || classIndex < 0) {
        throw new Error("Выберите класс");
      }

      const school = getSchoolByIndex(schoolIndex);
      const schoolName = String(school?.name || school?.title || school?.schoolName || "").trim();

      const classList = Array.isArray(school?.classes) ? school.classes : [];
      const classObj = classList[classIndex];
      const className = String(classObj?.name || classObj?.title || classObj?.className || "").trim();

      if (!schoolName) throw new Error("Некорректная школа");
      if (!className) throw new Error("Некорректный класс");

      const updates = {
        email: user.email,
        name: String(data.name || "").trim(),
        school: schoolName,
        class: className,
        profileComplete: true,
        emailVerified: user.emailVerified || true,
        updatedAt: new Date().toISOString()
      };

      if (!currentProfile?.createdAt) {
        updates.createdAt = new Date().toISOString();
      }

      await update(ref(db, "users/" + user.uid), updates);

      currentProfile = { ...currentProfile, ...updates };
      return currentProfile;
    }

    /* ============ НОВОСТИ с пагинацией ============ */

    function renderNewsSlice() {
      if (!newsContainer) return;

      if (!allNews.length) {
        newsContainer.innerHTML = `
          <div class="empty-state">
            <span class="material-symbols-outlined">article</span>
            <h3>Новостей пока нет</h3>
          </div>
        `;
        return;
      }

      const visibleNews = allNews.slice(0, newsShown);

      let html = '<div class="news-list">';

      visibleNews.forEach((item) => {
        const title = item.title || "Без заголовка";
        const fullText = item.text || item.desc || "";
        const desc = item.desc || fullText;
        const dateFull = formatDateTime(item.date);
        const dateShort = formatDateShort(item.date);

        const titleSafe = escapeHtml(title);
        const descSafe = sanitizeHtml(desc);
        const fullTextSafe = sanitizeHtml(fullText);
        const dateFullSafe = escapeHtml(dateFull);
        const dateShortSafe = escapeHtml(dateShort);

        html += `
          <div class="news-item" 
               data-title="${titleSafe}" 
               data-date="${dateFullSafe}" 
               data-text="${fullTextSafe.replace(/"/g, '&quot;')}">
            <div class="news-header">
              <div class="news-title">${titleSafe}</div>
              <div class="news-date">${dateShortSafe}</div>
            </div>
            <div class="news-desc">${descSafe}</div>
            <div class="news-desc-full">${fullTextSafe}</div>
          </div>
        `;
      });

      html += '</div>';

      // Кнопка "Показать ещё" — если ещё есть что показать
      if (newsShown < allNews.length) {
        const remaining = allNews.length - newsShown;
        const toShow = Math.min(NEWS_STEP, remaining);
        html += `
          <div class="show-more-wrap">
            <button class="show-more-btn" id="showMoreNewsBtn">
              <span class="material-symbols-outlined">expand_more</span>
              Показать ещё ${toShow} (осталось ${remaining})
            </button>
          </div>
        `;
      }

      newsContainer.innerHTML = html;

      // Обработчики открытия новости
      newsContainer.querySelectorAll(".news-item").forEach((el) => {
        el.addEventListener("click", function() {
          const title = this.dataset.title || "Новость";
          const date = this.dataset.date || "";
          const text = this.dataset.text || "Нет содержимого";
          openNewsModal(title, date, text);
        });
      });

      // Кнопка "Показать ещё"
      const moreBtn = document.getElementById("showMoreNewsBtn");
      if (moreBtn) {
        moreBtn.addEventListener("click", () => {
          newsShown += NEWS_STEP;
          renderNewsSlice();
        });
      }
    }

    async function loadNews() {
      try {
        const snapshot = await get(ref(db, "news"));
        const raw = snapshot.exists() ? snapshot.val() : [];
        const news = Array.isArray(raw) ? raw : Object.values(raw || {});

        // Сортировка: сначала новые
        allNews = news
          .slice()
          .sort((a, b) => Number(b.date || 0) - Number(a.date || 0));

        newsShown = NEWS_STEP;
        renderNewsSlice();
      } catch (error) {
        console.error("news load error:", error);
        newsContainer.innerHTML = `
          <div class="empty-state">
            <span class="material-symbols-outlined">error</span>
            <h3>Не удалось загрузить новости</h3>
          </div>
        `;
      }
    }

    /* ============ ПРОФИЛЬ ============ */

    profileSchoolSelect.addEventListener("change", updateClassOptionsForSelectedSchool);

    profileForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = String(profileNameInput.value || "").trim();

      if (!name) {
        alert("Введите имя");
        return;
      }

      try {
        await saveProfileData(currentUser, {
          ...currentProfile,
          name
        });

        renderHeader(currentUser);
        updateConsoleLink();
        closeProfileSetupModal();
        alert("Профиль сохранён");
      } catch (error) {
        console.error("save profile error:", error);
        alert(error.message || "Не удалось сохранить профиль");
      }
    });

    onAuthStateChanged(auth, async (user) => {
      currentUser = user;

      if (!user) {
        window.location.href = "auth.html";
        return;
      }

      try {
        const snapshot = await get(ref(db, "users/" + user.uid));
        currentProfile = snapshot.exists() ? snapshot.val() || {} : {};
      } catch (error) {
        console.error("load profile error:", error);
        currentProfile = {};
      }

      if (currentProfile.name) {
        user.displayName = currentProfile.name;
      }

      renderHeader(user);
      updateConsoleLink();

      await loadSchools();
      await loadNews();

      if (!currentProfile.name || !currentProfile.school || !currentProfile.class) {
        openProfileSetupModal(currentProfile);
      } else {
        closeProfileSetupModal();
      }
    });
  </script>
</body>
</html>
