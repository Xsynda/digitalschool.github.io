<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Главная · Электронная школа</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f8faff;
      min-height: 100vh;
      padding-top: 80px;
    }

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: #ffffff;
      border-bottom: 1px solid #eef3fa;
      box-shadow: 0 4px 20px rgba(0, 20, 40, 0.06);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .navbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      background: #2a7de1;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(42, 125, 225, 0.20);
    }

    .logo-text {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: #0a1e3c;
    }
    .logo-text span {
      color: #2a7de1;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-link {
      padding: 8px 18px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 14px;
      color: #1f2b48;
      text-decoration: none;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: 1.5px solid transparent;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }
    .nav-link:hover {
      background: #f0f4fe;
      border-color: #d0dae9;
    }
    .nav-link .material-symbols-outlined {
      font-size: 18px;
    }

    .navbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f0f6ff;
      padding: 6px 16px 6px 12px;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 500;
      color: #0a1e3c;
      cursor: pointer;
      transition: 0.15s;
      text-decoration: none;
      border: none;
      font-family: 'Inter', sans-serif;
    }
    .user-badge:hover {
      background: #e5effb;
      transform: scale(0.97);
    }
    .user-badge .material-symbols-outlined {
      color: #2a7de1;
      font-size: 20px;
    }

    .btn {
      border: none;
      padding: 6px 18px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Inter', sans-serif;
      text-decoration: none;
    }

    .btn-primary {
      background: #2a7de1;
      color: white;
      box-shadow: 0 4px 12px rgba(42, 125, 225, 0.20);
    }
    .btn-primary:hover {
      background: #1a5fb0;
      transform: scale(0.97);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 48px;
      box-shadow: 0 24px 60px rgba(0, 20, 40, 0.08);
      padding: 32px 40px 44px;
      border: 1px solid #f0f5fe;
    }

    .section-title {
      font-size: 22px;
      font-weight: 600;
      color: #0a1e3c;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-title .material-symbols-outlined {
      color: #2a7de1;
      font-size: 28px;
    }

    .news-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .news-item {
      background: #f9fcff;
      border-radius: 24px;
      padding: 20px 24px;
      border: 1px solid #eef3fa;
      transition: 0.15s;
    }
    .news-item:hover {
      border-color: #c7d9f0;
      background: #ffffff;
    }

    .news-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .news-title {
      font-size: 18px;
      font-weight: 600;
      color: #0a1e3c;
    }

    .news-date {
      font-size: 13px;
      color: #6a7f9e;
      background: #eef3fa;
      padding: 4px 14px;
      border-radius: 40px;
      white-space: nowrap;
    }

    .news-desc {
      font-size: 15px;
      color: #3d5270;
      line-height: 1.5;
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: #6a7f9e;
    }
    .empty-state .material-symbols-outlined {
      font-size: 48px;
      color: #d0dae9;
      margin-bottom: 12px;
    }
    .empty-state h3 {
      color: #0a1e3c;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .footer {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid #eef3fa;
      font-size: 13px;
      color: #889bb3;
      text-align: center;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #6a7f9e;
    }

    .admin-actions {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-admin {
      background: #8b5cf6;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Inter', sans-serif;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.25);
    }
    .btn-admin:hover {
      background: #7c3aed;
      transform: scale(0.97);
    }

    @media (max-width: 700px) {
      .navbar {
        padding: 10px 16px;
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .navbar-left {
        flex-wrap: wrap;
        justify-content: space-between;
      }
      .nav-links {
        justify-content: flex-start;
      }
      .navbar-right {
        justify-content: flex-start;
      }
      body {
        padding-top: 130px;
      }
    }

    @media (max-width: 480px) {
      .container { padding: 20px 16px 28px; border-radius: 32px; }
      .navbar-left { flex-direction: column; align-items: flex-start; gap: 6px; }
    }
  </style>
</head>
<body>

<header class="navbar" id="navbar">
  <div class="navbar-left">
    <div class="logo-area">
      <div class="logo-icon">Ш</div>
      <div class="logo-text">Электро<span>школа</span></div>
    </div>
    <nav class="nav-links" id="navLinks"></nav>
  </div>
  <div class="navbar-right" id="userArea"></div>
</header>

<div class="container">
  <div class="section-title">
    <span class="material-symbols-outlined">newspaper</span>
    Последние новости
  </div>

  <div id="newsContainer">
    <div class="loading">⏳ Загрузка новостей...</div>
  </div>

  <div class="admin-actions" id="adminActions" style="display: none;">
    <a href="editNews.html" class="btn-admin" target="_blank">
      <span class="material-symbols-outlined" style="font-size:20px;">edit_note</span>
      Редактировать новости
    </a>
  </div>

  <div class="footer">© 2026 · Электронная школа</div>
</div>

<!-- FIREBASE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-analytics.js";
  import {
    getAuth,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
  import {
    getDatabase,
    ref,
    get,
    child,
    onValue
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDGPv-cUMTSRBq9ZLmpDZFT-JYc3UOcCpY",
    authDomain: "digitalschool-f2c90.firebaseapp.com",
    projectId: "digitalschool-f2c90",
    storageBucket: "digitalschool-f2c90.firebasestorage.app",
    messagingSenderId: "797143730107",
    appId: "1:797143730107:web:b19437db896170d88b269e",
    measurementId: "G-FT9ENP491P"
  };

  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const auth = getAuth(app);
  const db = getDatabase(app);

  const AUTH_URL = 'https://xsynda.github.io/digitalschool.github.io/auth.html';
  const DIARY_URL = 'diary.html';
  const MAGAZINE_URL = 'magazine.html';
  const ACCOUNT_URL = 'account.html';
  const NEWS_COUNT = 15;

  const navLinks = document.getElementById('navLinks');
  const userArea = document.getElementById('userArea');
  const newsContainer = document.getElementById('newsContainer');
  const adminActions = document.getElementById('adminActions');

  function redirectToAuth() {
    window.location.href = AUTH_URL;
  }

  function formatDate(timestamp) {
    if (!timestamp) return '—';
    const date = new Date(timestamp * 1000);
    return date.toLocaleDateString('ru-RU', {
      day: 'numeric',
      month: 'long',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });
  }

  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function renderNews(newsData) {
    if (!newsData || Object.keys(newsData).length === 0) {
      newsContainer.innerHTML = `
        <div class="empty-state">
          <span class="material-symbols-outlined">feed_off</span>
          <h3>Новостей пока нет</h3>
          <p>Скоро здесь появятся первые новости</p>
        </div>
      `;
      return;
    }

    const keys = Object.keys(newsData).map(Number).sort((a, b) => b - a);
    const topKeys = keys.slice(0, NEWS_COUNT);

    let html = '<div class="news-list">';
    for (const key of topKeys) {
      const item = newsData[key];
      if (!item) continue;
      html += `
        <div class="news-item">
          <div class="news-header">
            <div class="news-title">${escapeHtml(item.title || 'Без названия')}</div>
            <div class="news-date">${formatDate(item.date)}</div>
          </div>
          ${item.desc ? `<div class="news-desc">${escapeHtml(item.desc)}</div>` : ''}
        </div>
      `;
    }
    html += '</div>';
    newsContainer.innerHTML = html;
  }

  function loadNews() {
    const newsRef = ref(db, 'news');
    onValue(newsRef, (snapshot) => {
      if (snapshot.exists()) {
        renderNews(snapshot.val());
      } else {
        renderNews(null);
      }
    }, (error) => {
      console.error('Ошибка загрузки новостей:', error);
      newsContainer.innerHTML = `
        <div class="empty-state">
          <span class="material-symbols-outlined">error</span>
          <h3>Ошибка загрузки</h3>
          <p>Не удалось загрузить новости. Попробуйте позже.</p>
        </div>
      `;
    });
  }

  function renderHeader(user, isAdmin) {
    // Только Дневник/Журнал — без кнопки Аккаунт
    const diaryLabel = isAdmin ? 'Журнал' : 'Дневник';
    const diaryUrl = isAdmin ? MAGAZINE_URL : DIARY_URL;
    const diaryIcon = isAdmin ? 'grading' : 'calendar_month';
    
    navLinks.innerHTML = `
      <a href="${diaryUrl}" class="nav-link">
        <span class="material-symbols-outlined">${diaryIcon}</span>
        ${diaryLabel}
      </a>
    `;

    if (user) {
      const displayName = user.displayName || user.email || 'Пользователь';
      userArea.innerHTML = `
        <a href="${ACCOUNT_URL}" class="user-badge">
          <span class="material-symbols-outlined">account_circle</span>
          ${escapeHtml(displayName)}
        </a>
      `;
    } else {
      userArea.innerHTML = `
        <a href="${AUTH_URL}" class="btn btn-primary">
          <span class="material-symbols-outlined" style="font-size:18px;">login</span>
          Войти
        </a>
      `;
    }

    adminActions.style.display = isAdmin ? 'flex' : 'none';
  }

  function loadUserAndRender(user) {
    if (!user) {
      renderHeader(null, false);
      return;
    }

    const userRef = ref(db, 'users/' + user.uid);
    get(userRef).then((snapshot) => {
      let isAdmin = false;
      let displayName = user.email;
      if (snapshot.exists()) {
        const data = snapshot.val();
        displayName = data.name || user.email;
        isAdmin = (data.status === 3);
      }
      user.displayName = displayName;
      renderHeader(user, isAdmin);
    }).catch((err) => {
      console.warn('Ошибка получения профиля:', err);
      renderHeader(user, false);
    });
  }

  onAuthStateChanged(auth, (user) => {
    if (user) {
      loadUserAndRender(user);
    } else {
      redirectToAuth();
    }
  });

  loadNews();
  console.log('✅ Главная страница (без кнопки Аккаунт)');
</script>
</body>
</html>
