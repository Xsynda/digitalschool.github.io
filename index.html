<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Главная · Электронная школа</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f8faff;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 48px;
      box-shadow: 0 24px 60px rgba(0, 20, 40, 0.08);
      padding: 40px 40px 44px;
      border: 1px solid #f0f5fe;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid #eef3fa;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      background: #2a7de1;
      color: white;
      width: 44px;
      height: 44px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 600;
      box-shadow: 0 8px 18px rgba(42, 125, 225, 0.20);
    }

    .logo-text {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: #0a1e3c;
    }
    .logo-text span {
      color: #2a7de1;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f0f6ff;
      padding: 8px 16px;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 500;
      color: #0a1e3c;
    }
    .user-badge .material-symbols-outlined {
      color: #2a7de1;
      font-size: 20px;
    }

    .btn {
      border: none;
      padding: 8px 20px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Inter', sans-serif;
      text-decoration: none;
    }

    .btn-primary {
      background: #2a7de1;
      color: white;
      box-shadow: 0 4px 12px rgba(42, 125, 225, 0.25);
    }
    .btn-primary:hover {
      background: #1a5fb0;
      transform: scale(0.97);
    }

    .btn-danger {
      color: #b14a4a;
      border: 1.5px solid #e0cdcd;
      background: transparent;
    }
    .btn-danger:hover {
      background: #fff2f2;
      border-color: #b14a4a;
    }

    .btn-admin {
      background: #8b5cf6;
      color: white;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.25);
    }
    .btn-admin:hover {
      background: #7c3aed;
      transform: scale(0.97);
    }

    .section-title {
      font-size: 22px;
      font-weight: 600;
      color: #0a1e3c;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-title .material-symbols-outlined {
      color: #2a7de1;
      font-size: 28px;
    }

    .news-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .news-item {
      background: #f9fcff;
      border-radius: 24px;
      padding: 20px 24px;
      border: 1px solid #eef3fa;
      transition: 0.15s;
    }
    .news-item:hover {
      border-color: #c7d9f0;
      background: #ffffff;
    }

    .news-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .news-title {
      font-size: 18px;
      font-weight: 600;
      color: #0a1e3c;
    }

    .news-date {
      font-size: 13px;
      color: #6a7f9e;
      background: #eef3fa;
      padding: 4px 14px;
      border-radius: 40px;
      white-space: nowrap;
    }

    .news-desc {
      font-size: 15px;
      color: #3d5270;
      line-height: 1.5;
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: #6a7f9e;
    }
    .empty-state .material-symbols-outlined {
      font-size: 48px;
      color: #d0dae9;
      margin-bottom: 12px;
    }
    .empty-state h3 {
      color: #0a1e3c;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .footer {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid #eef3fa;
      font-size: 13px;
      color: #889bb3;
      text-align: center;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #6a7f9e;
    }

    @media (max-width: 600px) {
      .container { padding: 24px 20px; }
      .header { flex-direction: column; align-items: stretch; }
      .user-area { justify-content: flex-start; }
    }
  </style>
</head>
<body>
<div class="container" id="app">
  <header class="header">
    <div class="logo-area">
      <div class="logo-icon">Ш</div>
      <div class="logo-text">Электро<span>школа</span></div>
    </div>
    <div class="user-area" id="userArea"></div>
  </header>

  <div class="section-title">
    <span class="material-symbols-outlined">newspaper</span>
    Последние новости
  </div>

  <div id="newsContainer">
    <div class="loading">⏳ Загрузка новостей...</div>
  </div>

  <div class="footer">© 2026 · Электронная школа</div>
</div>

<!-- FIREBASE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-analytics.js";
  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
  import {
    getDatabase,
    ref,
    get,
    child,
    onValue
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDGPv-cUMTSRBq9ZLmpDZFT-JYc3UOcCpY",
    authDomain: "digitalschool-f2c90.firebaseapp.com",
    projectId: "digitalschool-f2c90",
    storageBucket: "digitalschool-f2c90.firebasestorage.app",
    messagingSenderId: "797143730107",
    appId: "1:797143730107:web:b19437db896170d88b269e",
    measurementId: "G-FT9ENP491P"
  };

  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const auth = getAuth(app);
  const db = getDatabase(app);

  // ----- Константы -----
  const AUTH_URL = 'https://YOUR_GITHUB_PAGES_URL/auth.html'; // <-- ЗАМЕНИТЕ НА ВАШ URL
  const ADMIN_URL = 'https://sites.google.com/view/digitallenschool/editnews';
  const NEWS_COUNT = 15;

  // ----- DOM -----
  const userArea = document.getElementById('userArea');
  const newsContainer = document.getElementById('newsContainer');

  // ----- Функция перенаправления на авторизацию -----
  function redirectToAuth() {
    console.log('🔄 Неавторизован, перенаправление на:', AUTH_URL);
    window.location.href = AUTH_URL;
  }

  // ----- Форматирование даты -----
  function formatDate(timestamp) {
    if (!timestamp) return '—';
    const date = new Date(timestamp * 1000);
    return date.toLocaleDateString('ru-RU', {
      day: 'numeric',
      month: 'long',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });
  }

  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // ----- Рендер новостей -----
  function renderNews(newsData) {
    if (!newsData || Object.keys(newsData).length === 0) {
      newsContainer.innerHTML = `
        <div class="empty-state">
          <span class="material-symbols-outlined">feed_off</span>
          <h3>Новостей пока нет</h3>
          <p>Скоро здесь появятся первые новости</p>
        </div>
      `;
      return;
    }

    // Сортируем ключи (индексы) по убыванию — от новых к старым
    const keys = Object.keys(newsData).map(Number).sort((a, b) => b - a);
    const topKeys = keys.slice(0, NEWS_COUNT);

    if (topKeys.length === 0) {
      newsContainer.innerHTML = `
        <div class="empty-state">
          <span class="material-symbols-outlined">feed_off</span>
          <h3>Новостей пока нет</h3>
          <p>Скоро здесь появятся первые новости</p>
        </div>
      `;
      return;
    }

    let html = '<div class="news-list">';
    for (const key of topKeys) {
      const item = newsData[key];
      if (!item) continue;
      const title = item.title || 'Без названия';
      const desc = item.desc || '';
      const date = formatDate(item.date);
      html += `
        <div class="news-item">
          <div class="news-header">
            <div class="news-title">${escapeHtml(title)}</div>
            <div class="news-date">${date}</div>
          </div>
          ${desc ? `<div class="news-desc">${escapeHtml(desc)}</div>` : ''}
        </div>
      `;
    }
    html += '</div>';
    newsContainer.innerHTML = html;
  }

  // ----- Загрузка новостей -----
  function loadNews() {
    const newsRef = ref(db, 'news');
    onValue(newsRef, (snapshot) => {
      if (snapshot.exists()) {
        renderNews(snapshot.val());
      } else {
        renderNews(null);
      }
    }, (error) => {
      console.error('Ошибка загрузки новостей:', error);
      newsContainer.innerHTML = `
        <div class="empty-state">
          <span class="material-symbols-outlined">error</span>
          <h3>Ошибка загрузки</h3>
          <p>Не удалось загрузить новости. Попробуйте позже.</p>
        </div>
      `;
    });
  }

  // ----- Рендер пользовательской зоны -----
  function renderUserArea(user) {
    if (user) {
      const userRef = ref(db, 'users/' + user.uid);
      get(userRef).then((snapshot) => {
        let isAdmin = false;
        let userName = user.email;
        if (snapshot.exists()) {
          const data = snapshot.val();
          userName = data.name || user.email;
          isAdmin = (data.status === 3);
        }
        
        let html = `
          <div class="user-badge">
            <span class="material-symbols-outlined">account_circle</span>
            ${escapeHtml(userName)}
          </div>
        `;
        
        if (isAdmin) {
          html += `
            <a href="${ADMIN_URL}" class="btn btn-admin" target="_blank">
              <span class="material-symbols-outlined" style="font-size:18px;">edit_note</span>
              Редактировать новости
            </a>
          `;
        }
        
        html += `
          <button class="btn btn-danger" id="logoutBtn">
            <span class="material-symbols-outlined" style="font-size:18px;">logout</span>
            Выйти
          </button>
        `;
        
        userArea.innerHTML = html;
        
        document.getElementById('logoutBtn').addEventListener('click', async () => {
          try {
            await signOut(auth);
          } catch (e) {
            console.warn('Ошибка выхода:', e);
          }
        });
      }).catch((err) => {
        console.warn('Ошибка получения профиля:', err);
        userArea.innerHTML = `
          <div class="user-badge">
            <span class="material-symbols-outlined">account_circle</span>
            ${escapeHtml(user.email)}
          </div>
          <button class="btn btn-danger" id="logoutBtn">
            <span class="material-symbols-outlined" style="font-size:18px;">logout</span>
            Выйти
          </button>
        `;
        document.getElementById('logoutBtn').addEventListener('click', async () => {
          try {
            await signOut(auth);
          } catch (e) {
            console.warn('Ошибка выхода:', e);
          }
        });
      });
    } else {
      // Неавторизован — перенаправляем на страницу входа
      redirectToAuth();
    }
  }

  // ----- Следим за состоянием авторизации -----
  onAuthStateChanged(auth, (user) => {
    if (user) {
      renderUserArea(user);
    } else {
      redirectToAuth();
    }
  });

  // ----- Запуск -----
  loadNews();
  console.log('✅ Главная страница Электронной школы');
</script>
</body>
</html>
