<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Аккаунт · Электронная школа</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f8faff; min-height: 100vh; padding-top: 80px; }
    .navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: #ffffff; border-bottom: 1px solid #eef3fa; box-shadow: 0 4px 20px rgba(0, 20, 40, 0.06); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .navbar-left { display: flex; align-items: center; gap: 16px; }
    .logo-area { display: flex; align-items: center; gap: 10px; }
    .logo-icon { background: #2a7de1; color: white; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600; box-shadow: 0 4px 12px rgba(42, 125, 225, 0.20); }
    .logo-text { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; color: #0a1e3c; }
    .logo-text span { color: #2a7de1; }
    .nav-links { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .nav-link { padding: 8px 18px; border-radius: 40px; font-weight: 500; font-size: 14px; color: #1f2b48; text-decoration: none; transition: 0.15s; display: inline-flex; align-items: center; gap: 6px; background: transparent; border: 1.5px solid transparent; cursor: pointer; font-family: 'Inter', sans-serif; }
    .nav-link:hover { background: #f0f4fe; border-color: #d0dae9; }
    .nav-link .material-symbols-outlined { font-size: 18px; }
    .navbar-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .user-badge { display: flex; align-items: center; gap: 8px; background: #f0f6ff; padding: 6px 16px 6px 12px; border-radius: 40px; font-size: 14px; font-weight: 500; color: #0a1e3c; cursor: pointer; transition: 0.15s; text-decoration: none; border: none; font-family: 'Inter', sans-serif; }
    .user-badge:hover { background: #e5effb; transform: scale(0.97); }
    .user-badge .material-symbols-outlined { color: #2a7de1; font-size: 20px; }
    .btn { border: none; padding: 6px 18px; border-radius: 40px; font-weight: 500; font-size: 13px; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; font-family: 'Inter', sans-serif; text-decoration: none; }
    .btn-primary { background: #2a7de1; color: white; box-shadow: 0 4px 12px rgba(42, 125, 225, 0.20); }
    .btn-primary:hover { background: #1a5fb0; transform: scale(0.97); }
    .container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 48px; box-shadow: 0 24px 60px rgba(0, 20, 40, 0.08); padding: 32px 40px 44px; border: 1px solid #f0f5fe; }
    .page-title { font-size: 26px; font-weight: 600; color: #0a1e3c; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
    .page-title .material-symbols-outlined { color: #2a7de1; font-size: 32px; }
    .page-sub { color: #5f7696; font-size: 16px; margin-bottom: 28px; }
    .settings-card { background: #f9fcff; border-radius: 24px; padding: 24px; border: 1px solid #eef3fa; margin-bottom: 20px; }
    .settings-card .card-title { font-size: 16px; font-weight: 600; color: #0a1e3c; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .settings-card .card-title .material-symbols-outlined { color: #2a7de1; font-size: 22px; }
    .field-group { margin-bottom: 16px; }
    .field-group:last-child { margin-bottom: 0; }
    .field-group label { display: block; font-weight: 500; font-size: 14px; color: #1f2b48; margin-bottom: 6px; }
    .field-group input { width: 100%; padding: 12px 16px; border: 1.5px solid #dce4ef; border-radius: 30px; font-size: 15px; font-family: 'Inter', sans-serif; transition: 0.15s; background: #ffffff; }
    .field-group input:focus { outline: none; border-color: #2a7de1; box-shadow: 0 0 0 4px rgba(42, 125, 225, 0.10); }
    .field-group input:disabled { opacity: 0.6; background: #f5f7fa; cursor: not-allowed; }
    .btn-action { border: none; padding: 10px 24px; border-radius: 40px; font-weight: 500; font-size: 14px; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; font-family: 'Inter', sans-serif; }
    .btn-action-primary { background: #2a7de1; color: white; box-shadow: 0 4px 12px rgba(42, 125, 225, 0.25); }
    .btn-action-primary:hover { background: #1a5fb0; transform: scale(0.97); }
    .btn-action-success { background: #1a8a4a; color: white; box-shadow: 0 4px 12px rgba(26, 138, 74, 0.25); }
    .btn-action-success:hover { background: #146e3a; transform: scale(0.97); }
    .btn-action-danger { background: #c74a4a; color: white; box-shadow: 0 4px 12px rgba(199, 74, 74, 0.25); }
    .btn-action-danger:hover { background: #a33a3a; transform: scale(0.97); }
    .btn-full { width: 100%; justify-content: center; }
    .error-msg { color: #c74a4a; font-size: 14px; margin: 8px 0 12px; background: #fff0f0; padding: 8px 16px; border-radius: 40px; display: block; line-height: 1.4; }
    .error-msg.hidden { display: none; }
    .success-msg { color: #1a8a4a; font-size: 14px; margin: 8px 0 12px; background: #e8f5ed; padding: 8px 16px; border-radius: 40px; display: block; line-height: 1.4; }
    .success-msg.hidden { display: none; }
    .divider { border: none; border-top: 1px solid #eef3fa; margin: 24px 0; }
    .footer { margin-top: 32px; padding-top: 20px; border-top: 1px solid #eef3fa; font-size: 13px; color: #889bb3; text-align: center; }
    .loading { text-align: center; padding: 40px; color: #6a7f9e; }
    @media (max-width: 700px) { .navbar { padding: 10px 16px; flex-direction: column; align-items: stretch; gap: 8px; } .navbar-left { flex-wrap: wrap; justify-content: space-between; } .nav-links { justify-content: flex-start; } .navbar-right { justify-content: flex-start; } body { padding-top: 130px; } }
    @media (max-width: 480px) { .container { padding: 20px 16px 28px; border-radius: 32px; } .navbar-left { flex-direction: column; align-items: flex-start; gap: 6px; } }
  </style>
</head>
<body>

<header class="navbar" id="navbar">
  <div class="navbar-left">
    <div class="logo-area">
      <div class="logo-icon">Ш</div>
      <div class="logo-text">Электро<span>школа</span></div>
    </div>
    <nav class="nav-links">
      <a href="index.html" class="nav-link">
        <span class="material-symbols-outlined">home</span>
        Главная
      </a>
    </nav>
  </div>
  <div class="navbar-right" id="userArea">
    <!-- Имя пользователя -->
  </div>
</header>

<div class="container">
  <div class="page-title">
    <span class="material-symbols-outlined">account_circle</span>
    Аккаунт
  </div>
  <div class="page-sub">Управление личными данными</div>

  <div id="profileContainer">
    <div class="loading">⏳ Загрузка данных...</div>
  </div>

  <div class="footer">© 2026 · Электронная школа</div>
</div>

<!-- FIREBASE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-analytics.js";
  import {
    getAuth,
    onAuthStateChanged,
    signOut,
    updatePassword,
    reauthenticateWithCredential,
    EmailAuthProvider
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
  import {
    getDatabase,
    ref,
    get,
    update,
    child
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDGPv-cUMTSRBq9ZLmpDZFT-JYc3UOcCpY",
    authDomain: "digitalschool-f2c90.firebaseapp.com",
    projectId: "digitalschool-f2c90",
    storageBucket: "digitalschool-f2c90.firebasestorage.app",
    messagingSenderId: "797143730107",
    appId: "1:797143730107:web:b19437db896170d88b269e",
    measurementId: "G-FT9ENP491P"
  };

  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const auth = getAuth(app);
  const db = getDatabase(app);

  const AUTH_URL = 'https://xsynda.github.io/digitalschool.github.io/auth.html';
  const ACCOUNT_URL = 'account.html';
  const profileContainer = document.getElementById('profileContainer');
  const userArea = document.getElementById('userArea');

  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function showError(element, message) {
    if (!element) return;
    element.textContent = message;
    element.classList.remove('hidden');
  }

  function hideError(element) {
    if (!element) return;
    element.classList.add('hidden');
  }

  function showSuccess(element, message) {
    if (!element) return;
    element.textContent = message;
    element.classList.remove('hidden');
    setTimeout(() => element.classList.add('hidden'), 4000);
  }

  // ----- ОБНОВЛЕНИЕ ИМЕНИ В ШАПКЕ -----
  function updateUserBadge(user) {
    if (!user) return;
    const displayName = user.displayName || user.email || 'Пользователь';
    const badge = userArea.querySelector('.user-badge');
    if (badge) {
      badge.innerHTML = `
        <span class="material-symbols-outlined">account_circle</span>
        ${escapeHtml(displayName)}
      `;
    }
  }

  // ----- РЕНДЕР ШАПКИ (исправленный) -----
  function renderHeader(user) {
    if (user) {
      let displayName = user.displayName || user.email || 'Пользователь';
      
      // Если имя не загружено, пытаемся получить из базы
      if (!user.displayName || user.displayName === user.email) {
        const userRef = ref(db, 'users/' + user.uid);
        get(userRef).then((snapshot) => {
          if (snapshot.exists()) {
            const data = snapshot.val();
            const name = data.name || user.email || 'Пользователь';
            user.displayName = name;
            updateUserBadge(user);
          }
        }).catch(() => {});
      }
      
      userArea.innerHTML = `
        <a href="${ACCOUNT_URL}" class="user-badge">
          <span class="material-symbols-outlined">account_circle</span>
          ${escapeHtml(displayName)}
        </a>
      `;
    } else {
      userArea.innerHTML = `
        <a href="${AUTH_URL}" class="btn btn-primary">
          <span class="material-symbols-outlined" style="font-size:18px;">login</span>
          Войти
        </a>
      `;
    }
  }

  // ----- РЕНДЕР ПРОФИЛЯ -----
  function renderProfile(user, profileData) {
    const name = profileData?.name || user.email || 'Пользователь';
    const email = user.email || '—';
    const statusMap = { 1: 'ученик', 2: 'администратор' };
    const status = statusMap[profileData?.status] || 'неизвестно';

    // Обновляем имя в шапке
    user.displayName = name;
    updateUserBadge(user);

    profileContainer.innerHTML = `
      <div class="settings-card">
        <div class="card-title">
          <span class="material-symbols-outlined">info</span>
          Информация
        </div>
        <div class="field-group">
          <label>Email</label>
          <input type="text" value="${escapeHtml(email)}" disabled />
        </div>
        <div class="field-group">
          <label>Статус</label>
          <input type="text" value="${escapeHtml(status)}" disabled />
        </div>
      </div>

      <div class="settings-card">
        <div class="card-title">
          <span class="material-symbols-outlined">edit</span>
          Изменить имя
        </div>
        <div class="field-group">
          <label>Новое имя</label>
          <input type="text" id="newNameInput" value="${escapeHtml(name)}" placeholder="Введите новое имя" />
        </div>
        <div id="nameError" class="error-msg hidden"></div>
        <div id="nameSuccess" class="success-msg hidden"></div>
        <button class="btn-action btn-action-primary" id="updateNameBtn">💾 Сохранить имя</button>
      </div>

      <div class="settings-card">
        <div class="card-title">
          <span class="material-symbols-outlined">lock</span>
          Сменить пароль
        </div>
        <div class="field-group">
          <label>Текущий пароль</label>
          <input type="password" id="currentPasswordInput" placeholder="Введите текущий пароль" />
        </div>
        <div class="field-group">
          <label>Новый пароль</label>
          <input type="password" id="newPasswordInput" placeholder="Минимум 6 символов" />
        </div>
        <div class="field-group">
          <label>Подтверждение пароля</label>
          <input type="password" id="confirmPasswordInput" placeholder="Повторите новый пароль" />
        </div>
        <div id="passwordError" class="error-msg hidden"></div>
        <div id="passwordSuccess" class="success-msg hidden"></div>
        <button class="btn-action btn-action-success" id="updatePasswordBtn">🔑 Сменить пароль</button>
      </div>

      <hr class="divider" />

      <button class="btn-action btn-action-danger btn-full" id="logoutBtn">
        <span class="material-symbols-outlined" style="font-size:20px;">logout</span>
        Выйти из аккаунта
      </button>
    `;

    // Обработчики
    document.getElementById('updateNameBtn').addEventListener('click', async () => {
      const nameError = document.getElementById('nameError');
      const nameSuccess = document.getElementById('nameSuccess');
      const newName = document.getElementById('newNameInput').value.trim();

      hideError(nameError);
      hideError(nameSuccess);

      if (!newName) {
        showError(nameError, '⚠️ Имя не может быть пустым');
        return;
      }

      try {
        await update(ref(db, 'users/' + user.uid), { name: newName });
        showSuccess(nameSuccess, '✅ Имя успешно обновлено!');
        document.getElementById('newNameInput').value = newName;
        user.displayName = newName;
        updateUserBadge(user);
      } catch (error) {
        console.error('Ошибка обновления имени:', error);
        showError(nameError, '❌ Ошибка: ' + (error.message || 'попробуйте позже'));
      }
    });

    document.getElementById('updatePasswordBtn').addEventListener('click', async () => {
      const passwordError = document.getElementById('passwordError');
      const passwordSuccess = document.getElementById('passwordSuccess');
      const currentPassword = document.getElementById('currentPasswordInput').value;
      const newPassword = document.getElementById('newPasswordInput').value;
      const confirmPassword = document.getElementById('confirmPasswordInput').value;

      hideError(passwordError);
      hideError(passwordSuccess);

      if (!currentPassword) {
        showError(passwordError, '⚠️ Введите текущий пароль');
        return;
      }
      if (newPassword.length < 6) {
        showError(passwordError, '⚠️ Новый пароль должен содержать минимум 6 символов');
        return;
      }
      if (newPassword !== confirmPassword) {
        showError(passwordError, '⚠️ Пароли не совпадают');
        return;
      }

      try {
        const credential = EmailAuthProvider.credential(user.email, currentPassword);
        await reauthenticateWithCredential(user, credential);
        await updatePassword(user, newPassword);
        showSuccess(passwordSuccess, '✅ Пароль успешно изменён!');
        document.getElementById('currentPasswordInput').value = '';
        document.getElementById('newPasswordInput').value = '';
        document.getElementById('confirmPasswordInput').value = '';
      } catch (error) {
        console.error('Ошибка смены пароля:', error);
        if (error.code === 'auth/wrong-password') {
          showError(passwordError, '❌ Неверный текущий пароль');
        } else if (error.code === 'auth/requires-recent-login') {
          showError(passwordError, '❌ Для безопасности требуется повторный вход. Выйдите и зайдите снова.');
        } else {
          showError(passwordError, '❌ Ошибка: ' + (error.message || 'попробуйте позже'));
        }
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      if (confirm('Вы уверены, что хотите выйти из аккаунта?')) {
        try {
          await signOut(auth);
          window.location.href = AUTH_URL;
        } catch (error) {
          console.error('Ошибка выхода:', error);
          alert('Ошибка выхода: ' + error.message);
        }
      }
    });
  }

  // ----- ЗАГРУЗКА ПРОФИЛЯ -----
  async function loadProfile(user) {
    renderHeader(user);
    try {
      const snapshot = await get(child(ref(db), 'users/' + user.uid));
      if (snapshot.exists()) {
        renderProfile(user, snapshot.val());
      } else {
        renderProfile(user, null);
      }
    } catch (error) {
      console.error('Ошибка загрузки профиля:', error);
      profileContainer.innerHTML = `
        <div class="settings-card">
          <div class="error-msg" style="display:block;">❌ Ошибка загрузки данных. Попробуйте обновить страницу.</div>
          <button class="btn-action btn-action-primary" onclick="location.reload()">🔄 Обновить</button>
        </div>
      `;
    }
  }

  // ----- АВТОРИЗАЦИЯ -----
  onAuthStateChanged(auth, (user) => {
    if (user) {
      loadProfile(user);
    } else {
      window.location.href = AUTH_URL;
    }
  });

  console.log('✅ Страница аккаунта с исправленным отображением имени');
</script>
</body>
</html>
