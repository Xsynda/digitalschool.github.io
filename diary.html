<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Дневник · Электронная школа</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f8faff; min-height: 100vh; padding-top: 80px; }

    .navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: #ffffff; border-bottom: 1px solid #eef3fa; box-shadow: 0 4px 20px rgba(0, 20, 40, 0.06); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .navbar-left { display: flex; align-items: center; gap: 16px; }
    .logo-area { display: flex; align-items: center; gap: 10px; }
    .logo-icon { background: #2a7de1; color: white; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600; box-shadow: 0 4px 12px rgba(42, 125, 225, 0.20); }
    .logo-text { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; color: #0a1e3c; }
    .logo-text span { color: #2a7de1; }
    .nav-links { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .nav-link { padding: 8px 18px; border-radius: 40px; font-weight: 500; font-size: 14px; color: #1f2b48; text-decoration: none; transition: 0.15s; display: inline-flex; align-items: center; gap: 6px; background: transparent; border: 1.5px solid transparent; }
    .nav-link:hover { background: #f0f4fe; border-color: #d0dae9; }
    .nav-link.active { background: #e5effb; border-color: #2a7de1; color: #2a7de1; }
    .nav-link .material-symbols-outlined { font-size: 18px; }
    .navbar-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .user-badge { display: flex; align-items: center; gap: 8px; background: #f0f6ff; padding: 6px 16px 6px 12px; border-radius: 40px; font-size: 14px; font-weight: 500; color: #0a1e3c; cursor: pointer; transition: 0.15s; text-decoration: none; border: none; font-family: 'Inter', sans-serif; }
    .user-badge:hover { background: #e5effb; transform: scale(0.97); }
    .user-badge .material-symbols-outlined { color: #2a7de1; font-size: 20px; }
    .btn { border: none; padding: 6px 18px; border-radius: 40px; font-weight: 500; font-size: 13px; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; font-family: 'Inter', sans-serif; text-decoration: none; }
    .btn-primary { background: #2a7de1; color: white; box-shadow: 0 4px 12px rgba(42, 125, 225, 0.20); }
    .btn-primary:hover { background: #1a5fb0; transform: scale(0.97); }

    .container { max-width: 1000px; margin: 0 auto; background: #ffffff; border-radius: 48px; box-shadow: 0 24px 60px rgba(0, 20, 40, 0.08); padding: 32px 40px 44px; border: 1px solid #f0f5fe; }
    .page-title { font-size: 26px; font-weight: 600; color: #0a1e3c; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
    .page-title .material-symbols-outlined { color: #2a7de1; font-size: 32px; }
    .page-sub { color: #5f7696; font-size: 16px; margin-bottom: 28px; }

    .schedule-grid {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .section-wrap {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 600;
      color: #5f7696;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0 4px;
    }

    .toggle-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .toggle-block {
      display: flex;
      justify-content: flex-end;
      margin: 0 0 4px;
    }

    .toggle-btn {
      background: #fff;
      border: 1px solid #dce4ef;
      color: #1f2b48;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .toggle-btn:hover {
      background: #f0f6ff;
      border-color: #2a7de1;
      color: #2a7de1;
    }

    .day-card { background: #f9fcff; border-radius: 24px; border: 1px solid #eef3fa; overflow: hidden; }
    .day-card.past { opacity: 0.7; }
    .day-card.past .day-header { background: #f5f8fc; color: #6a7f9e; }

    .day-header { background: #f0f6ff; padding: 14px 24px; font-weight: 600; font-size: 18px; color: #0a1e3c; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #eef3fa; }
    .day-header .past-badge { font-size: 12px; font-weight: 400; color: #6a7f9e; background: #eef3fa; padding: 2px 12px; border-radius: 40px; margin-left: 8px; }

    .day-body { overflow: hidden; }

    .lessons-grid { display: grid; grid-template-columns: 44px 1.2fr 1.8fr; gap: 0; }
    .lesson-cell { padding: 14px 16px; border-bottom: 1px solid #eef3fa; border-right: 1px solid #eef3fa; display: flex; align-items: center; font-size: 14px; color: #1f2b48; cursor: pointer; transition: 0.1s; }
    .lesson-cell:last-child { border-right: none; }
    .lesson-cell:hover { background: #f0f6ff; }
    .lesson-number { font-weight: 600; color: #6a7f9e; justify-content: center; background: #f5f8fc; border-right: 1px solid #eef3fa; }
    .lesson-name { font-weight: 500; background: #ffffff; flex-wrap: wrap; gap: 6px; }
    .lesson-time { font-size: 13px; color: #6a7f9e; font-weight: 400; margin-left: 6px; }
    .lesson-homework { background: #ffffff; flex-direction: column; align-items: flex-start; gap: 4px; padding: 10px 16px; }
    .homework-preview { font-size: 13px; color: #3d5270; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; word-break: break-word; line-height: 1.4; max-height: 2.8em; width: 100%; }
    .homework-preview a { color: #2a7de1; text-decoration: underline; }
    .homework-preview a:hover { text-decoration: none; }
    .homework-preview img { max-width: 100%; max-height: 80px; border-radius: 8px; margin-top: 4px; object-fit: cover; }
    .homework-empty { color: #a0b3cc; font-style: italic; font-size: 13px; }
    .empty-state { text-align: center; padding: 48px 20px; color: #6a7f9e; }
    .empty-state .material-symbols-outlined { font-size: 48px; color: #d0dae9; margin-bottom: 12px; }
    .empty-state h3 { color: #0a1e3c; font-weight: 500; margin-bottom: 4px; }
    .footer { margin-top: 32px; padding-top: 20px; border-top: 1px solid #eef3fa; font-size: 13px; color: #889bb3; text-align: center; }
    .loading { text-align: center; padding: 40px; color: #6a7f9e; }

    .show-past-btn { display: block; width: 100%; padding: 12px; margin-top: 12px; border: 2px dashed #d0dae9; border-radius: 20px; background: transparent; color: #5f7696; font-weight: 500; font-size: 14px; cursor: pointer; transition: 0.2s; font-family: 'Inter', sans-serif; }
    .show-past-btn:hover { background: #f0f6ff; border-color: #2a7de1; color: #2a7de1; }
    .show-past-btn .material-symbols-outlined { font-size: 18px; vertical-align: middle; }

    .past-section { display: none; }
    .past-section.visible { display: block; }

    .load-more-btn { display: none; width: 100%; padding: 12px; margin-top: 12px; border: 2px dashed #d0dae9; border-radius: 20px; background: transparent; color: #5f7696; font-weight: 500; font-size: 14px; cursor: pointer; transition: 0.2s; font-family: 'Inter', sans-serif; }
    .load-more-btn:hover { background: #f0f6ff; border-color: #2a7de1; color: #2a7de1; }
    .load-more-btn .material-symbols-outlined { font-size: 18px; vertical-align: middle; }
    .load-more-btn.visible { display: block; }

    .future-days-wrapper { display: flex; flex-direction: column; gap: 24px; }
    .future-days-wrapper .day-card { display: none; }
    .future-days-wrapper .day-card.visible { display: block; }

    /* Модальное окно */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.35); backdrop-filter: blur(4px); align-items: center; justify-content: center; z-index: 2000; }
    .modal-overlay.active { display: flex; }
    .modal-card { background: #ffffff; max-width: 480px; width: 90%; padding: 32px 28px; border-radius: 32px; box-shadow: 0 30px 60px rgba(0,0,0,0.2); animation: modalFade 0.2s ease; max-height: 90vh; overflow-y: auto; }
    @keyframes modalFade { 0% { transform: translateY(20px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
    .modal-card .modal-title { font-size: 22px; font-weight: 600; color: #0a1e3c; margin-bottom: 4px; }
    .modal-card .modal-sub { font-size: 14px; color: #6a7f9e; margin-bottom: 16px; }
    .modal-card .modal-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eef3fa; font-size: 14px; }
    .modal-card .modal-row:last-child { border-bottom: none; }
    .modal-card .modal-row .label { color: #6a7f9e; font-weight: 500; }
    .modal-card .modal-row .value { color: #0a1e3c; font-weight: 500; text-align: right; }
    .modal-card .modal-homework { margin-top: 12px; padding: 12px 16px; background: #f9fcff; border-radius: 16px; font-size: 14px; color: #0a1e3c; line-height: 1.6; border: 1px solid #eef3fa; word-break: break-word; white-space: pre-wrap; }
    .modal-card .modal-homework a { color: #2a7de1; text-decoration: underline; }
    .modal-card .modal-homework a:hover { text-decoration: none; }
    .modal-card .modal-homework img { max-width: 100%; height: auto; border-radius: 12px; margin: 6px 0; }
    .modal-card .modal-close { margin-top: 20px; width: 100%; padding: 12px; border: none; border-radius: 40px; background: #eef3fa; color: #1f2b48; font-weight: 500; font-size: 15px; cursor: pointer; font-family: 'Inter', sans-serif; transition: 0.15s; }
    .modal-card .modal-close:hover { background: #dce4ef; }

    @media (max-width: 700px) {
      .navbar { padding: 10px 16px; flex-direction: column; align-items: stretch; gap: 8px; }
      .navbar-left { flex-wrap: wrap; justify-content: space-between; }
      .nav-links { justify-content: flex-start; }
      .navbar-right { justify-content: flex-start; }
      body { padding-top: 130px; }
      .container { padding: 20px 16px 28px; border-radius: 32px; }
      .lessons-grid { grid-template-columns: 32px 1fr 1.4fr; font-size: 13px; }
      .lesson-cell { padding: 10px 12px; }
      .day-header { font-size: 16px; padding: 12px 16px; }
    }
    @media (max-width: 480px) {
      .lessons-grid { grid-template-columns: 28px 1fr 1.6fr; font-size: 12px; }
      .lesson-cell { padding: 8px 10px; }
      .lesson-time { font-size: 11px; }
    }
  </style>
</head>
<body>

<header class="navbar" id="navbar">
  <div class="navbar-left">
    <div class="logo-area"><div class="logo-icon">Ш</div><div class="logo-text">Электро<span>школа</span></div></div>
    <nav class="nav-links" id="navLinks">
      <a href="index.html" class="nav-link"><span class="material-symbols-outlined">home</span> Главная</a>
      <a href="diary.html" class="nav-link active"><span class="material-symbols-outlined">calendar_month</span> Дневник</a>
    </nav>
  </div>
  <div class="navbar-right" id="userArea"></div>
</header>

<div class="container">
  <div class="page-title"><span class="material-symbols-outlined">calendar_month</span> Дневник</div>
  <div class="page-sub">Расписание уроков и домашние задания</div>
  <div id="scheduleContainer">
    <div class="loading">⏳ Загрузка расписания...</div>
    <div class="schedule-grid">
      <div class="day-card">
        <div class="day-header">
          <span class="material-symbols-outlined">event_note</span>
          <span class="day-header-text">День</span>
        </div>
        <div class="day-body">
          <div class="lessons-grid">
            <div class="lesson-cell lesson-number" style="font-weight:600;background:#f5f8fc;">№</div>
            <div class="lesson-cell lesson-name" style="font-weight:600;background:#f5f8fc;">Урок</div>
            <div class="lesson-cell lesson-homework" style="font-weight:600;background:#f5f8fc;border-right:none;">Домашнее задание</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="footer">© 2026 · Электронная школа</div>
</div>

<!-- Модальное окно -->
<div class="modal-overlay" id="lessonModal">
  <div class="modal-card">
    <div class="modal-title" id="modalTitle">Название урока</div>
    <div class="modal-sub" id="modalTime">⏰ Время</div>
    <div class="modal-row"><span class="label">🪑 Кабинет</span><span class="value" id="modalCab">—</span></div>
    <div class="modal-row" style="border-bottom: none;"><span class="label">📚 Домашнее задание</span></div>
    <div class="modal-homework" id="modalHomework">Нет задания</div>
    <button class="modal-close" id="modalCloseBtn">Закрыть</button>
  </div>
</div>

<!-- FIREBASE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
  import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDGPv-cUMTSRBq9ZLmpDZFT-JYc3UOcCpY",
    authDomain: "digitalschool-f2c90.firebaseapp.com",
    projectId: "digitalschool-f2c90",
    storageBucket: "digitalschool-f2c90.appspot.com",
    messagingSenderId: "797143730107",
    appId: "1:797143730107:web:b19437db896170d88b269e",
    measurementId: "G-FT9ENP491P"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  const AUTH_URL = "auth.html";
  const ACCOUNT_URL = "account.html";
  const scheduleContainer = document.getElementById("scheduleContainer");
  const userArea = document.getElementById("userArea");

  function escapeHtml(value) {
    if (value === null || value === undefined) return "";
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function redirectToAuth() {
    window.location.href = AUTH_URL;
  }

  function parseDateString(value) {
    if (!value) return null;
    const clean = String(value).trim();

    if (/^\d{2}\.\d{2}\.\d{4}$/.test(clean)) {
      const [d, m, y] = clean.split(".");
      return new Date(Number(y), Number(m) - 1, Number(d));
    }

    if (/^\d{4}-\d{2}-\d{2}$/.test(clean)) {
      const [y, m, d] = clean.split("-");
      return new Date(Number(y), Number(m) - 1, Number(d));
    }

    return null;
  }

  function sortScheduleDays(scheduleArray) {
    return [...scheduleArray]
      .sort((a, b) => {
        const da = a?.date ? parseDateString(a.date) : null;
        const db = b?.date ? parseDateString(b.date) : null;

        if (!da && !db) return 0;
        if (!da) return 1;
        if (!db) return -1;
        return da - db;
      })
      .map((day) => {
        const lessons = Array.isArray(day?.lessons)
          ? [...day.lessons].sort((x, y) => {
              const aNum = Number(x?.number ?? x?.lessonNumber ?? x?.num ?? 0);
              const bNum = Number(y?.number ?? y?.lessonNumber ?? y?.num ?? 0);
              return aNum - bNum;
            })
          : [];

        return { ...day, lessons };
      });
  }

  function formatDayHeader(dateValue) {
    const date = parseDateString(dateValue);
    if (!date) return "День";

    const days = ["Воскресенье", "Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"];
    const months = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];

    return `${days[date.getDay()]}, ${date.getDate()} ${months[date.getMonth()]}`;
  }

  function isPastDate(dateValue) {
    const date = parseDateString(dateValue);
    if (!date) return false;

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    return date < today;
  }

  function processHomeworkText(text) {
    if (!text) return '<span class="homework-empty">нет задания</span>';

    let html = escapeHtml(text)
      .replace(/\n/g, "<br>")
      .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');

    return html;
  }

  function renderHeader(user) {
    const displayName = user?.displayName || user?.email || "Пользователь";
    userArea.innerHTML = `
      <a href="${ACCOUNT_URL}" class="user-badge">
        <span class="material-symbols-outlined">account_circle</span>
        ${escapeHtml(displayName)}
      </a>
    `;
  }

  function openLessonModal(lesson) {
    const modal = document.getElementById("lessonModal");
    if (!modal) return;

    const title = document.getElementById("modalTitle");
    const time = document.getElementById("modalTime");
    const cab = document.getElementById("modalCab");
    const homework = document.getElementById("modalHomework");

    title.textContent = lesson?.name || "Урок";
    time.textContent = lesson?.time ? `⏰ ${lesson.time}` : "⏰ Время не указано";
    cab.textContent = lesson?.cab ?? "—";
    homework.innerHTML = lesson?.homework ? processHomeworkText(lesson.homework) : "Нет задания";

    modal.classList.add("active");
  }

  document.getElementById("modalCloseBtn")?.addEventListener("click", () => {
    document.getElementById("lessonModal")?.classList.remove("active");
  });

  function renderSchedule(scheduleArray) {
    if (!Array.isArray(scheduleArray) || !scheduleArray.length) {
      scheduleContainer.innerHTML = `
        <div class="empty-state">
          <span class="material-symbols-outlined">event_busy</span>
          <h3>Расписание пока пустое</h3>
          <div>Для этого класса ещё не создано ни одного дня.</div>
        </div>
      `;
      return;
    }

    const sorted = sortScheduleDays(scheduleArray);
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const pastDays = sorted.filter((day) => {
      const d = parseDateString(day?.date);
      return d && d < today;
    });

    const futureDays = sorted.filter((day) => {
      const d = parseDateString(day?.date);
      return d && d >= today;
    });

    let futureShown = Math.min(5, futureDays.length);
    let showPast = false;

    const renderDayMarkup = (day) => {
      const lessons = Array.isArray(day?.lessons) ? day.lessons : [];
      const dayHeader = formatDayHeader(day?.date || "01.01.2000");
      const past = isPastDate(day?.date);

      let html = `
        <div class="day-card ${past ? "past" : ""}">
          <div class="day-header">
            <span class="material-symbols-outlined">${past ? "history" : "event_note"}</span>
            ${escapeHtml(dayHeader)}
            ${past ? '<span class="past-badge">прошёл</span>' : ""}
          </div>
          <div class="day-body">
            <div class="lessons-grid">
              <div class="lesson-cell lesson-number" style="font-weight:600;background:#f5f8fc;">№</div>
              <div class="lesson-cell lesson-name" style="font-weight:600;background:#f5f8fc;">Урок</div>
              <div class="lesson-cell lesson-homework" style="font-weight:600;background:#f5f8fc;border-right:none;">Домашнее задание</div>
      `;

      if (!lessons.length) {
        html += `
            <div class="lesson-cell lesson-number">—</div>
            <div class="lesson-cell lesson-name">Нет уроков</div>
            <div class="lesson-cell lesson-homework" style="border-right:none;">—</div>
        `;
      } else {
        lessons.forEach((lesson, lessonIndex) => {
          const name = lesson?.name || `Урок ${lessonIndex + 1}`;
          const time = lesson?.time ? `<span class="lesson-time">${escapeHtml(lesson.time)}</span>` : "";
          const homework = lesson?.homework ? processHomeworkText(lesson.homework) : '<span class="homework-empty">нет задания</span>';

          html += `
            <div class="lesson-cell lesson-number">${lessonIndex + 1}</div>
            <div class="lesson-cell lesson-name"
                 data-name="${escapeHtml(name)}"
                 data-time="${escapeHtml(lesson?.time || "")}"
                 data-cab="${escapeHtml(lesson?.cab ?? "")}"
                 data-homework="${escapeHtml(lesson?.homework || "")}">
              ${escapeHtml(name)}${time}
            </div>
            <div class="lesson-cell lesson-homework"
                 style="border-right:none;"
                 data-name="${escapeHtml(name)}"
                 data-time="${escapeHtml(lesson?.time || "")}"
                 data-cab="${escapeHtml(lesson?.cab ?? "")}"
                 data-homework="${escapeHtml(lesson?.homework || "")}">
              <div class="homework-preview">${homework}</div>
            </div>
          `;
        });
      }

      html += `
            </div>
          </div>
        </div>
      `;

      return html;
    };

    const renderView = () => {
      const visiblePast = showPast ? pastDays.slice(0, 5) : [];
      const visibleFuture = futureDays.slice(0, futureShown);

      let html = `<div class="schedule-grid">`;

      if (pastDays.length > 0) {
        html += `
          <div class="toggle-block">
            <button class="toggle-btn" data-toggle="past">
              ${showPast ? "Скрыть прошедшие" : "Показать прошедшие"}
            </button>
          </div>
        `;
      }

      if (showPast && visiblePast.length) {
        html += visiblePast.map(renderDayMarkup).join("");
      }

      if (visibleFuture.length) {
        html += visibleFuture.map(renderDayMarkup).join("");
      }

      const remainingFuture = Math.max(0, futureDays.length - futureShown);
      if (remainingFuture > 0) {
        html += `
          <div class="toggle-block">
            <button class="toggle-btn" data-toggle="future-more">
              Показать ещё ${Math.min(5, remainingFuture)} будущих
            </button>
          </div>
        `;
      }

      html += `</div>`;

      scheduleContainer.innerHTML = html;

      scheduleContainer.querySelectorAll("[data-toggle]").forEach((btn) => {
        btn.addEventListener("click", () => {
          if (btn.dataset.toggle === "past") {
            showPast = !showPast;
            renderView();
          }

          if (btn.dataset.toggle === "future-more") {
            futureShown = Math.min(futureShown + 5, futureDays.length);
            renderView();
          }
        });
      });

      scheduleContainer.querySelectorAll(".lesson-name, .lesson-homework").forEach((el) => {
        el.addEventListener("click", () => {
          const lesson = {
            name: el.dataset.name || "Урок",
            time: el.dataset.time || "",
            cab: el.dataset.cab || "",
            homework: el.dataset.homework || ""
          };

          if (lesson.name || lesson.time || lesson.cab || lesson.homework) {
            openLessonModal(lesson);
          }
        });
      });
    };

    renderView();
  }

  function resolveSchoolIndexFromProfile(profile = {}, schools = []) {
    const raw = profile.schoolIndex ?? profile.school ?? profile.schoolId ?? profile.allowedSchoolIndex ?? 0;

    if (raw === null || raw === undefined || raw === "") return 0;
    if (Number.isInteger(Number(raw))) {
      const idx = Number(raw);
      return idx >= 0 && idx < schools.length ? idx : 0;
    }

    const value = String(raw).trim();
    const found = schools.findIndex((school) => {
      const candidates = [school?.id, school?.schoolId, school?.name, school?.title];
      return candidates.some((item) => String(item ?? "").trim() === value);
    });

    return found >= 0 ? found : 0;
  }

  function resolveClassIndexFromProfile(profile = {}, school = null) {
    const classes = Array.isArray(school?.classes) ? school.classes : [];
    const raw = profile.classIndex ?? profile.class ?? profile.classId ?? profile.allowedClassIndex ?? 0;

    if (raw === null || raw === undefined || raw === "") return 0;
    if (Number.isInteger(Number(raw))) {
      const idx = Number(raw);
      return idx >= 0 && idx < classes.length ? idx : 0;
    }

    const value = String(raw).trim();
    const found = classes.findIndex((cls) => {
      const candidates = [cls?.id, cls?.classId, cls?.name, cls?.title];
      return candidates.some((item) => String(item ?? "").trim() === value);
    });

    return found >= 0 ? found : 0;
  }

  async function loadScheduleForAccount(user) {
    try {
      const profileSnap = await get(ref(db, `users/${user.uid}`));
      const profile = profileSnap.exists() ? profileSnap.val() : {};

      const schoolsSnap = await get(ref(db, "schools"));
      const schools = schoolsSnap.exists() ? schoolsSnap.val() : [];

      const schoolIndex = resolveSchoolIndexFromProfile(profile, schools);
      const school = Array.isArray(schools) ? schools[schoolIndex] : null;

      if (!school || !Array.isArray(school.classes) || !school.classes.length) {
        scheduleContainer.innerHTML = `
          <div class="empty-state">
            <span class="material-symbols-outlined">school</span>
            <h3>Расписание не назначено</h3>
            <div>У этого аккаунта не указаны школа или класс.</div>
          </div>
        `;
        return;
      }

      const classIndex = resolveClassIndexFromProfile(profile, school);
      const classData = school.classes[classIndex];

      if (!classData) {
        scheduleContainer.innerHTML = `
          <div class="empty-state">
            <span class="material-symbols-outlined">warning</span>
            <h3>Класс не найден</h3>
            <div>Проверьте настройки профиля аккаунта.</div>
          </div>
        `;
        return;
      }

      const schedule = Array.isArray(classData.schedule) ? classData.schedule : [];
      renderSchedule(schedule);
    } catch (error) {
      console.error("Ошибка загрузки расписания:", error);
      scheduleContainer.innerHTML = `
        <div class="empty-state">
          <span class="material-symbols-outlined">error</span>
          <h3>Ошибка подключения к базе</h3>
          <div>Проверьте права доступа и данные аккаунта.</div>
        </div>
      `;
    }
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      redirectToAuth();
      return;
    }

    try {
      const profileSnap = await get(ref(db, `users/${user.uid}`));
      const profile = profileSnap.exists() ? profileSnap.val() : {};

      user.displayName = profile.fullName || profile.name || profile.displayName || user.email || "Пользователь";
      renderHeader(user);
      await loadScheduleForAccount(user);
    } catch (error) {
      console.error("Auth error:", error);
      user.displayName = user.email || "Пользователь";
      renderHeader(user);

      scheduleContainer.innerHTML = `
        <div class="empty-state">
          <span class="material-symbols-outlined">error</span>
          <h3>Ошибка подключения к базе</h3>
          <div>Проверьте Firebase-правила и доступ к данным.</div>
        </div>
      `;
    }
  });
</script>
</body>
</html>
